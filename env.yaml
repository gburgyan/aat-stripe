# Stripe in test mode. Every environment calls api.stripe.com with the secret key in
# STRIPE_API_KEY, the variable the Stripe CLI reads. Use a test key (sk_test_...): every node
# that creates an object fails a response whose livemode is true, so a live key stops at its
# first object.
#
# `_stripe` holds what the environments share. `_pinned` sends the API version of the vendored
# spec (openapi/spec3.json) and fails any exchange the spec doesn't allow; `test` and `test-ci`
# extend it. `account-default` sends no Stripe-Version, so Stripe answers at the account's
# default version, and the spec's findings are reported without failing a step. Pick one with
# --env; the manifest defaults to test.
shared:
  headers:
    Accept: application/json

environments:
  _stripe:
    notes: Stripe test mode. Export STRIPE_API_KEY with an sk_test_ secret key.
    vars:
      # Webhook plans register this URL. Stripe only needs a public HTTPS URL; point it at a
      # receiver you control with --var webhookUrl=... to see deliveries.
      webhookUrl: https://example.com/aat-stripe/webhooks
      # Guard plans look at objects created at or after this Unix time (2026-09-15T00:00:00Z),
      # when the package started, and fail on any tagged metadata[source]=aat-stripe that is
      # still live.
      packageEpoch: "1789430400"
    apiBaseUrl: https://api.stripe.com
    auth:
      type: bearer
      credentials:
        token:
          source: env
          var: STRIPE_API_KEY
    values:
      webhookUrl: ${webhookUrl}
      packageEpoch: ${packageEpoch}

  # The spec's API version, with every request and response checked against the spec.
  _pinned:
    extends: _stripe
    vars:
      stripeVersion: 2026-08-26.dahlia
    headers:
      Stripe-Version: ${stripeVersion}
    settings:
      oasValidation: strict

  test:
    extends: _pinned

  # Long batches: the same account, with request starts spaced out. Test mode allows 25
  # requests a second; this stays near 16.
  test-ci:
    extends: test
    notes: Paced for long batches under Stripe's 25 requests a second.
    settings:
      minRequestInterval: 60ms

  # The account's own default API version (2025-12-15.clover on the author's account). Run the
  # drift plans here to see what changes between it and the pinned version.
  account-default:
    extends: _stripe
    notes: No Stripe-Version header; responses come at the account's default API version.
    settings:
      oasValidation: auto
