execution:
  steps:
    - id: declined
      node: confirmPaymentIntent
      description: Confirm with a card reported lost
      values:
        paymentIntentId: {from: create.paymentIntentId}
        paymentMethod: pm_card_visa_chargeDeclinedLostCard
      expectFailure:
        status: [402]
        description: card_error card_declined lost_card
      assertions:
        mechanical:
          - type: predicate
            expr: >-
              error.type == "card_error" && error.code == "card_declined" && error.decline_code == "lost_card" &&
              error.advice_code == "do_not_try_again" &&
              error.payment_intent.id == "{{create.paymentIntentId}}" && error.payment_intent.status == "requires_payment_method"
          - type: fieldAbsent
            path: error.param
