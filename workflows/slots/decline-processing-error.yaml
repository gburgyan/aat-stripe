execution:
  steps:
    - id: declined
      node: confirmPaymentIntent
      description: Confirm with a card whose charge meets a processing error
      values:
        paymentIntentId: {from: create.paymentIntentId}
        paymentMethod: pm_card_chargeDeclinedProcessingError
      expectFailure:
        status: [402]
        description: card_error processing_error processing_error
      assertions:
        mechanical:
          - type: predicate
            expr: >-
              error.type == "card_error" && error.code == "processing_error" && error.decline_code == "processing_error" &&
              error.advice_code == "try_again_later" &&
              error.payment_intent.id == "{{create.paymentIntentId}}" && error.payment_intent.status == "requires_payment_method"
          - type: fieldAbsent
            path: error.param
