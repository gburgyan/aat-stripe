execution:
  steps:
    - id: declined
      node: confirmPaymentIntent
      description: Confirm with a card the issuer suspects of fraud
      values:
        paymentIntentId: {from: create.paymentIntentId}
        paymentMethod: pm_card_chargeDeclinedFraudulent
      expectFailure:
        status: [402]
        description: card_error card_declined fraudulent
      assertions:
        mechanical:
          - type: predicate
            expr: >-
              error.type == "card_error" && error.code == "card_declined" && error.decline_code == "fraudulent" &&
              error.payment_intent.id == "{{create.paymentIntentId}}" && error.payment_intent.status == "requires_payment_method"
          - type: fieldAbsent
            path: error.param
          - type: fieldAbsent
            path: error.advice_code
