execution:
  steps:
    - id: declined
      node: confirmPaymentIntent
      description: Confirm with an expired card
      values:
        paymentIntentId: {from: create.paymentIntentId}
        paymentMethod: pm_card_chargeDeclinedExpiredCard
      expectFailure:
        status: [402]
        description: card_error expired_card expired_card
      assertions:
        mechanical:
          - type: predicate
            expr: >-
              error.type == "card_error" && error.code == "expired_card" && error.decline_code == "expired_card" &&
              error.param == "exp_month" &&
              error.advice_code == "confirm_card_data" &&
              error.payment_intent.id == "{{create.paymentIntentId}}" && error.payment_intent.status == "requires_payment_method"
