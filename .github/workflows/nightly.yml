name: nightly run

# Runs the whole project against Stripe's live test API once a day, so the numbers in the README are
# reproducible from this repository. Skips when the repository has no key. Each run's archives are
# uploaded, with the credentials Stripe returns removed first, so what the API actually said can be
# opened with `aat web`.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  batch:
    runs-on: ubuntu-latest
    env:
      AAT_VERSION: 0.2.0
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.STRIPE_API_KEY }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "STRIPE_API_KEY is not set; nothing to run"; fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - name: Install aat
        if: steps.token.outputs.present == 'true'
        run: |
          curl -fsSL "https://github.com/gburgyan/aat/releases/download/v${AAT_VERSION}/aat_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin aat
          aat --version
      - name: Validate
        if: steps.token.outputs.present == 'true'
        run: aat validate --strict
      - name: Run every plan
        if: steps.token.outputs.present == 'true'
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: aat run batch --env test-ci

      # Stripe's list reads return intents this project never created, some still open,
      # each carrying a live client secret. AAT redacts what a run sends, not what an
      # API hands back, and this artifact is public.
      - name: Redact the credentials Stripe returned
        if: always() && steps.token.outputs.present == 'true'
        run: python3 .github/scrub-archives.py _output/runs

      - name: Say how to open the archives
        if: always() && steps.token.outputs.present == 'true'
        run: |
          mkdir -p _output/runs
          cat > _output/runs/HOW-TO-VIEW.md <<'EOF'
          # The archives from this run

          Every request and response of this batch, as AAT recorded it.

          Unpack this artifact, then, with aat 0.2.0 or later on your PATH:

              aat web --output .              # the whole batch in the browser
              aat run show latest --output .  # the last run's steps, in the terminal

          AAT redacts every credential it sent before writing an archive, and
          `.github/scrub-archives.py` removes the one Stripe hands back: the client
          secret on a PaymentIntent or SetupIntent.
          EOF

      # A failed run is when these are worth opening most, so they upload either way.
      - name: Upload the run archives
        if: always() && steps.token.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: run-archives
          path: _output/runs/
          retention-days: 14
