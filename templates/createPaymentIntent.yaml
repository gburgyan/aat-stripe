adapter: createPaymentIntent
protocol: http

request:
  method: POST
  path: /v1/payment_intents
  headers:
    Idempotency-Key: "{{idempotencyKey}}"
  form:
    amount: "{{amount}}"
    currency: "{{currency}}"
    customer: "{{customerId}}"
    payment_method: "{{paymentMethod}}"
    payment_method_types[]: "{{paymentMethodTypes}}"
    capture_method: "{{captureMethod}}"
    confirm: "{{confirm}}"
    return_url: "{{returnUrl}}"
    error_on_requires_action: "{{errorOnRequiresAction}}"
    off_session: "{{offSession}}"
    setup_future_usage: "{{setupFutureUsage}}"
    description: "{{description}}"
    payment_method_options:
      card:
        request_incremental_authorization: "{{requestIncrementalAuthorization}}"
    expand[]: latest_charge
    metadata:
      source: aat-stripe
      expected_brand: "{{expectedBrand}}"

response:
  extract:
    paymentIntentId: id
    status: status
    amount: amount
    currency: currency
    amountCapturable: amount_capturable
    amountReceived: amount_received
    captureMethod: capture_method
    livemode: livemode
    customerId:
      path: customer
      default: ""
    paymentMethodId:
      path: payment_method
      default: ""
    latestChargeId:
      path: latest_charge.id
      default: ""
    cardBrand:
      path: latest_charge.payment_method_details.card.brand
      default: ""
    nextActionType:
      path: next_action.type
      default: ""
    lastErrorCode:
      path: last_payment_error.code
      default: ""
    lastDeclineCode:
      path: last_payment_error.decline_code
      default: ""
    cancellationReason:
      path: cancellation_reason
      default: ""
    expectedBrand:
      path: metadata.expected_brand
      default: ""
    source:
      path: metadata.source
      default: ""
