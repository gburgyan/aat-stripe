adapter: createPaymentMethod
protocol: http

request:
  method: POST
  path: /v1/payment_methods
  headers:
    Idempotency-Key: "{{idempotencyKey}}"
  form:
    type: "{{type}}"
    card:
      token: "{{cardToken}}"
    billing_details:
      name: "{{billingName}}"
      email: "{{billingEmail}}"
    metadata:
      source: aat-stripe

response:
  extract:
    paymentMethodId: id
    type: type
    livemode: livemode
    customerId:
      path: customer
      default: ""
    cardBrand:
      path: card.brand
      default: ""
    cardLast4:
      path: card.last4
      default: ""
    cardCountry:
      path: card.country
      default: ""
    cardFunding:
      path: card.funding
      default: ""
    billingName:
      path: billing_details.name
      default: ""
    allowRedisplay:
      path: allow_redisplay
      default: ""
    note:
      path: metadata.note
      default: ""
    source:
      path: metadata.source
      default: ""
