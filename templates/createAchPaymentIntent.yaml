adapter: createAchPaymentIntent
protocol: http

request:
  method: POST
  path: /v1/payment_intents
  headers:
    Idempotency-Key: "{{idempotencyKey}}"
  form:
    amount: "{{amount}}"
    currency: "{{currency}}"
    customer: "{{customerId}}"
    payment_method: "{{paymentMethod}}"
    payment_method_types[]: us_bank_account
    confirm: "{{confirm}}"
    off_session: "{{offSession}}"
    payment_method_options:
      us_bank_account:
        verification_method: "{{verificationMethod}}"
    mandate_data:
      customer_acceptance:
        type: "{{acceptanceType}}"
        online:
          ip_address: "{{acceptanceIp}}"
          user_agent: "{{acceptanceUserAgent}}"
    expand[]: latest_charge
    metadata:
      source: aat-stripe

response:
  extract:
    paymentIntentId: id
    status: status
    amount: amount
    currency: currency
    amountReceived: amount_received
    livemode: livemode
    customerId:
      path: customer
      default: ""
    paymentMethodId:
      path: payment_method
      default: ""
    latestChargeId:
      path: latest_charge.id
      default: ""
    chargeStatus:
      path: latest_charge.status
      default: ""
    mandateId:
      path: latest_charge.payment_method_details.us_bank_account.mandate
      default: ""
    nextActionType:
      path: next_action.type
      default: ""
    microdepositType:
      path: next_action.verify_with_microdeposits.microdeposit_type
      default: ""
    lastErrorType:
      path: last_payment_error.type
      default: ""
    lastErrorCode:
      path: last_payment_error.code
      default: ""
    lastDeclineCode:
      path: last_payment_error.decline_code
      default: ""
    chargeFailureCode:
      path: latest_charge.failure_code
      default: ""
    source:
      path: metadata.source
      default: ""
