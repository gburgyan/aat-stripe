adapter: createCustomerBalanceTransaction
protocol: http

request:
  method: POST
  path: /v1/customers/{{customerId}}/balance_transactions
  headers:
    Idempotency-Key: "{{idempotencyKey}}"
  form:
    amount: "{{amount}}"
    currency: "{{currency}}"
    description: "{{description}}"
    metadata:
      source: aat-stripe

response:
  extract:
    customerBalanceTransactionId: id
    type: type
    amount: amount
    currency: currency
    endingBalance: ending_balance
    description:
      path: description
      default: ""
    note:
      path: metadata.note
      default: ""
    source:
      path: metadata.source
      default: ""
