adapter: listCustomerBalanceTransactions
protocol: http

request:
  method: GET
  path: /v1/customers/{{customerId}}/balance_transactions?limit={{limit}}{{?startingAfter}}&starting_after={{startingAfter}}{{/startingAfter}}

response:
  extract:
    transactions:
      path: data
      fields:
        id: id
        type: type
        amount: amount
        endingBalance: ending_balance
    count: 'data.#'
    hasMore: has_more
    lastId:
      path: data.@reverse.0.id
      default: ""
    latestEndingBalance:
      path: data.0.ending_balance
      default: 0
