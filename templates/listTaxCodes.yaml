adapter: listTaxCodes
protocol: http

request:
  method: GET
  path: /v1/tax_codes?limit={{limit}}{{?startingAfter}}&starting_after={{startingAfter}}{{/startingAfter}}

response:
  extract:
    taxCodes:
      path: data
      fields:
        id: id
        name: name
    count: 'data.#'
    hasMore: has_more
    lastId:
      path: data.@reverse.0.id
      default: ""
