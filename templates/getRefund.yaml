adapter: getRefund
protocol: http

request:
  method: GET
  path: /v1/refunds/{{refundId}}

response:
  extract:
    refundId: id
    status: status
    amount: amount
    currency: currency
    paymentIntentId:
      path: payment_intent
      default: ""
    chargeId:
      path: charge
      default: ""
    reason:
      path: reason
      default: ""
    failureReason:
      path: failure_reason
      default: ""
    pendingReason:
      path: pending_reason
      default: ""
    source:
      path: metadata.source
      default: ""
