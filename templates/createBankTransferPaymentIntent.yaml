adapter: createBankTransferPaymentIntent
protocol: http

request:
  method: POST
  path: /v1/payment_intents
  headers:
    Idempotency-Key: "{{idempotencyKey}}"
  form:
    amount: "{{amount}}"
    currency: "{{currency}}"
    customer: "{{customerId}}"
    payment_method_types[]: customer_balance
    payment_method_data:
      type: customer_balance
    payment_method_options:
      customer_balance:
        funding_type: bank_transfer
        bank_transfer:
          type: "{{bankTransferType}}"
          eu_bank_transfer:
            country: "{{euCountry}}"
    confirm: "{{confirm}}"
    expand[]: latest_charge
    metadata:
      source: aat-stripe

response:
  extract:
    paymentIntentId: id
    status: status
    amount: amount
    currency: currency
    amountReceived: amount_received
    livemode: livemode
    customerId:
      path: customer
      default: ""
    latestChargeId:
      path: latest_charge.id
      default: ""
    nextActionType:
      path: next_action.type
      default: ""
    amountRemaining:
      path: next_action.display_bank_transfer_instructions.amount_remaining
      default: 0
    source:
      path: metadata.source
      default: ""
