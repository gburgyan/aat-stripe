adapter: getSetupIntent
protocol: http

request:
  method: GET
  path: /v1/setup_intents/{{setupIntentId}}

response:
  extract:
    setupIntentId: id
    status: status
    usage: usage
    livemode: livemode
    customerId:
      path: customer
      default: ""
    paymentMethodId:
      path: payment_method
      default: ""
    latestAttemptId:
      path: latest_attempt
      default: ""
    nextActionType:
      path: next_action.type
      default: ""
    lastSetupErrorCode:
      path: last_setup_error.code
      default: ""
    lastSetupErrorDeclineCode:
      path: last_setup_error.decline_code
      default: ""
    cancellationReason:
      path: cancellation_reason
      default: ""
    description:
      path: description
      default: ""
    note:
      path: metadata.note
      default: ""
    source:
      path: metadata.source
      default: ""
