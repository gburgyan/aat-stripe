adapter: listTaxIds
protocol: http

request:
  method: GET
  path: /v1/customers/{{customerId}}/tax_ids?limit={{limit}}{{?startingAfter}}&starting_after={{startingAfter}}{{/startingAfter}}

response:
  extract:
    taxIds:
      path: data
      fields:
        id: id
        type: type
        value: value
    count: 'data.#'
    hasMore: has_more
    lastId:
      path: data.@reverse.0.id
      default: ""
