adapter: listEvents
protocol: http

request:
  method: GET
  path: /v1/events?limit={{limit}}{{?eventType}}&type={{eventType}}{{/eventType}}{{?createdGte}}&created[gte]={{createdGte}}{{/createdGte}}{{?startingAfter}}&starting_after={{startingAfter}}{{/startingAfter}}

response:
  extract:
    events:
      path: data
      fields:
        id: id
        type: type
        objectId: data.object.id
        requestId: request.id
        apiVersion: api_version
    count: 'data.#'
    hasMore: has_more
    lastId:
      path: data.@reverse.0.id
      default: ""
