adapter: listSetupAttempts
protocol: http

request:
  method: GET
  path: /v1/setup_attempts?setup_intent={{setupIntentId}}&limit={{limit}}{{?startingAfter}}&starting_after={{startingAfter}}{{/startingAfter}}

response:
  extract:
    attempts:
      path: data
      fields:
        id: id
        status: status
        usage: usage
    count: 'data.#'
    hasMore: has_more
    lastId:
      path: data.@reverse.0.id
      default: ""
    latestStatus:
      path: data.0.status
      default: ""
