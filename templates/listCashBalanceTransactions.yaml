adapter: listCashBalanceTransactions
protocol: http

request:
  method: GET
  path: /v1/customers/{{customerId}}/cash_balance_transactions?limit={{limit}}{{?startingAfter}}&starting_after={{startingAfter}}{{/startingAfter}}

response:
  extract:
    transactions:
      path: data
      fields:
        id: id
        type: type
        netAmount: net_amount
        endingBalance: ending_balance
        currency: currency
    count: 'data.#'
    hasMore: has_more
    lastId:
      path: data.@reverse.0.id
      default: ""
    latestType:
      path: data.0.type
      default: ""
    latestEndingBalance:
      path: data.0.ending_balance
      default: 0
