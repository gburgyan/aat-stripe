adapter: createConfirmationToken
protocol: http

request:
  method: POST
  path: /v1/test_helpers/confirmation_tokens
  headers:
    Idempotency-Key: "{{idempotencyKey}}"
  form:
    payment_method: "{{paymentMethod}}"
    setup_future_usage: "{{setupFutureUsage}}"
    return_url: "{{returnUrl}}"

response:
  extract:
    confirmationTokenId: id
    livemode: livemode
    created: created
    expiresAt: expires_at
    setupFutureUsage:
      path: setup_future_usage
      default: ""
    previewType:
      path: payment_method_preview.type
      default: ""
    previewBrand:
      path: payment_method_preview.card.brand
      default: ""
    previewLast4:
      path: payment_method_preview.card.last4
      default: ""
    paymentIntentId:
      path: payment_intent
      default: ""
    setupIntentId:
      path: setup_intent
      default: ""
