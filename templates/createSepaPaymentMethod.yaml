adapter: createSepaPaymentMethod
protocol: http

request:
  method: POST
  path: /v1/payment_methods
  headers:
    Idempotency-Key: "{{idempotencyKey}}"
  form:
    type: sepa_debit
    sepa_debit:
      iban: "{{iban}}"
    billing_details:
      name: "{{billingName}}"
      email: "{{billingEmail}}"
    metadata:
      source: aat-stripe

response:
  extract:
    paymentMethodId: id
    type: type
    livemode: livemode
    customerId:
      path: customer
      default: ""
    country:
      path: sepa_debit.country
      default: ""
    last4:
      path: sepa_debit.last4
      default: ""
    bankCode:
      path: sepa_debit.bank_code
      default: ""
    billingName:
      path: billing_details.name
      default: ""
    source:
      path: metadata.source
      default: ""
