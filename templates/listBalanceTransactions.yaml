adapter: listBalanceTransactions
protocol: http

request:
  method: GET
  path: /v1/balance_transactions?limit={{limit}}{{?transactionType}}&type={{transactionType}}{{/transactionType}}{{?createdGte}}&created[gte]={{createdGte}}{{/createdGte}}{{?startingAfter}}&starting_after={{startingAfter}}{{/startingAfter}}

response:
  extract:
    transactions:
      path: data
      fields:
        id: id
        type: type
        amount: amount
        currency: currency
        status: status
    count: 'data.#'
    hasMore: has_more
    firstId:
      path: data.0.id
      default: ""
    lastId:
      path: data.@reverse.0.id
      default: ""
