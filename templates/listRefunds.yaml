adapter: listRefunds
protocol: http

request:
  method: GET
  path: /v1/refunds?limit={{limit}}{{?paymentIntentId}}&payment_intent={{paymentIntentId}}{{/paymentIntentId}}{{?chargeId}}&charge={{chargeId}}{{/chargeId}}{{?startingAfter}}&starting_after={{startingAfter}}{{/startingAfter}}

response:
  extract:
    refunds:
      path: data
      fields:
        id: id
        status: status
        amount: amount
    count: 'data.#'
    hasMore: has_more
    lastId:
      path: data.@reverse.0.id
      default: ""
  # The refunds on the page, added up, so a plan can check they cover the payment.
  transform: |
    local total = 0
    for _, refund in ipairs(json_path("data") or {}) do
      total = total + (refund.amount or 0)
    end
    outputs.totalAmount = total
    return outputs
