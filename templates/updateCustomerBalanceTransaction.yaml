adapter: updateCustomerBalanceTransaction
protocol: http

request:
  method: POST
  path: /v1/customers/{{customerId}}/balance_transactions/{{customerBalanceTransactionId}}
  form:
    description: "{{description}}"
    metadata:
      note: "{{note}}"

response:
  extract:
    customerBalanceTransactionId: id
    type: type
    amount: amount
    currency: currency
    endingBalance: ending_balance
    description:
      path: description
      default: ""
    note:
      path: metadata.note
      default: ""
    source:
      path: metadata.source
      default: ""
