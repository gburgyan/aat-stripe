# When saving or charging a card needs the customer. A card that requires authentication on setup stops its SetupIntent
# at requires_action with a redirect, and cleanup cancels it. A declined card is 402 card_declined and still leaves its
# SetupIntent open, which the plan finds and cancels. Charged off session, a card that requires authentication is 402
# authentication_required and leaves its PaymentIntent open, which the plan cancels too.
intent:
  goal: cancelOffSession
  description: Authentication stops a SetupIntent, and declines and off-session authentication refuse while leaving objects open

execution:
  steps:
    - id: customer
      node: createCustomer
      description: A customer tagged metadata[source]=aat-stripe
      assertions:
        mechanical:
          - type: predicate
            expr: livemode == false && source == "aat-stripe"

    - id: needsAuth
      node: createSetupIntent
      dependsOn: [customer]
      description: Save a card that requires authentication on setup
      values:
        paymentMethod: pm_card_authenticationRequiredOnSetup
        confirm: true
        usage: off_session
        returnUrl: https://example.com/aat-stripe/return
      assertions:
        mechanical:
          - type: predicate
            expr: livemode == false && status == "requires_action" && nextActionType == "redirect_to_url"

    - id: declined
      node: createSetupIntent
      dependsOn: [needsAuth]
      description: Save a card that is declined
      values:
        paymentMethod: pm_card_visa_chargeDeclined
        confirm: true
      expectFailure:
        status: [402]
        description: card_error card_declined generic_decline
      assertions:
        mechanical:
          - type: predicate
            expr: error.type == "card_error" && error.code == "card_declined" && error.decline_code == "generic_decline"
          - type: fieldAbsent
            path: error.param

    - id: openSetups
      node: listSetupIntents
      dependsOn: [declined]
      description: The customer's SetupIntents after the decline, both open
      values:
        customerId: {from: customer.customerId}
      assertions:
        mechanical:
          - type: predicate
            expr: count == 2 && ourOpenCount == 2

    - id: cancelDeclined
      node: cancelSetupIntent
      description: Cancel the SetupIntent the decline left open
      values:
        setupIntentId:
          from: openSetups.setupIntents
          select:
            strategy: first
            field: id
            filter: status == "requires_payment_method"
      assertions:
        mechanical:
          - type: predicate
            expr: status == "canceled" && setupIntentId != "{{needsAuth.setupIntentId}}"

    - id: card
      node: attachPaymentMethod
      dependsOn: [cancelDeclined]
      description: Attach a card that requires authentication for every payment
      values:
        paymentMethodId: pm_card_authenticationRequired
        customerId: {from: customer.customerId}
      assertions:
        mechanical:
          - type: predicate
            expr: customerId == "{{customer.customerId}}" && paymentMethodId != "pm_card_authenticationRequired"

    - id: offSession
      node: createPaymentIntent
      description: Charge the card off session
      values:
        paymentMethod: {from: card.paymentMethodId}
        expectedBrand: {}
        confirm: true
        offSession: true
      expectFailure:
        status: [402]
        description: authentication_required
      assertions:
        mechanical:
          - type: predicate
            expr: >-
              error.type == "card_error" && error.code == "authentication_required" &&
              error.decline_code == "authentication_required" && error.payment_intent.status == "requires_payment_method"
          - type: fieldAbsent
            path: error.param

    - id: openPayments
      node: listPaymentIntents
      dependsOn: [offSession]
      description: The customer's PaymentIntents after the refusal
      values:
        customerId: {from: customer.customerId}
      assertions:
        mechanical:
          - type: predicate
            expr: count == 1 && ourOpenCount == 1

    - id: cancelOffSession
      node: cancelPaymentIntent
      isGoal: true
      description: Cancel the PaymentIntent the refusal left open
      values:
        paymentIntentId:
          from: openPayments.paymentIntents
          select:
            strategy: first
            field: id
      assertions:
        mechanical:
          - type: predicate
            expr: status == "canceled"
