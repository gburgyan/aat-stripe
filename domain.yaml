# What these plans have verified about Stripe's API in test mode. Each concept names the plans that
# prove it; nothing here is copied from the docs without a run behind it.
concepts:
  testMode:
    description: >-
      Every call carries "Authorization: Bearer <secret key>". A test key (sk_test_) reaches only test
      mode, where the balance and every object carry livemode false. The environments read the key
      from STRIPE_API_KEY, the Stripe CLI's variable. Proven by plans/account/account-and-balance.yaml.
    applies_to: [livemode]
    constraint: check that livemode is false before creating anything

  errors:
    description: >-
      Errors share one envelope, {"error": {"type", "code", "decline_code", "param", "message"}}. An
      unknown or already deleted ID is 404 invalid_request_error with code resource_missing and param
      id. Proven by plans/customers/lifecycle.yaml.
    applies_to: [error]
    constraint: branch on error.type and error.code, and check error.param for the field at fault

  pagination:
    description: >-
      Lists come newest first. limit takes 1 to 100, and starting_after takes the last ID of the
      previous page. has_more is false on the last page, which still holds items, so a reader stops on
      has_more rather than on an empty page. Filters such as created[gte] take Unix seconds. Proven by
      plans/reference/tax-codes.yaml and plans/zz-guard/customers.yaml.
    applies_to: [limit, startingAfter, lastId, hasMore, count, createdGte]
    constraint: pass lastId back as startingAfter, and stop when hasMore is false

  idempotency:
    description: >-
      A POST whose Idempotency-Key Stripe has already seen answers with the first response: the same
      object, with Idempotent-Replayed true and Original-Request naming the first request, under a
      Request-Id of its own. The same key with other parameters, or on another endpoint, is 400
      idempotency_error with no code and no param, and changes nothing. Proven by
      plans/idempotency/replay.yaml and plans/idempotency/conflict.yaml.
    applies_to: [idempotencyKey, idempotentReplayed, originalRequest, requestId]
    constraint: send a fresh key for each new request, and the same key only to retry that request

  apiVersions:
    description: >-
      Without a Stripe-Version header Stripe answers at the account's default API version, and the
      Stripe-Version response header names the version it answered at. Events are rendered at the
      account's default version whatever the request sent. Proven by drift/account-default.yaml and
      plans/account/events.yaml.
    applies_to: [stripeVersion, apiVersion]
    constraint: pin Stripe-Version to the spec's version so responses match its schemas

  packageObjects:
    description: >-
      Every object this package creates carries metadata[source]=aat-stripe. The guard plans count
      those and fail on any left behind; objects from earlier projects on the same account are left
      alone. Proven by the plans in plans/zz-guard/.
    applies_to: [source, ourCount, ourCustomers]

  customers:
    description: >-
      A deleted customer drops out of the list but still reads 200, with only id, object, and deleted
      true, and deleting it again is 404 resource_missing. Proven by plans/customers/lifecycle.yaml.
    applies_to: [customerId, deleted]

  events:
    description: >-
      A change made through the API leaves an event naming the object it changed and the request
      behind it, with that request's Idempotency-Key. Proven by plans/account/events.yaml.
    applies_to: [eventId, eventType, objectId, requestId, idempotencyKey]

  paymentIntents:
    description: >-
      A PaymentIntent tracks one payment. Confirmed with a card, it ends succeeded, or with capture_method manual it waits
      in requires_capture with its whole amount capturable. A capture of less than the amount receives that much and
      releases the rest, and the PaymentIntent ends succeeded with nothing left to capture. It can be canceled only
      while it is requires_payment_method, requires_confirmation, requires_action, or requires_capture; a cancel then
      ends canceled with the reason given. Proven by plans/payments/automatic-capture.yaml,
      plans/payments/manual-capture.yaml, plans/payments/partial-capture.yaml, and plans/payments/cancel-authorization.yaml.
    applies_to: [paymentIntentId, status, amountCapturable, amountReceived, captureMethod, amountToCapture, cancellationReason]
    constraint: read a PaymentIntent's status before canceling it, and cancel only one still open

  declines:
    description: >-
      A declined card is 402 card_error with a code, a decline_code, and an advice_code, and the error names the
      PaymentIntent, which stays requires_payment_method with the error recorded and can be confirmed again with
      another card. An expired card and a wrong CVC also name the param at fault (exp_month, cvc). A create that
      confirms and is declined leaves the PaymentIntent's ID only in the error, so create first and confirm after.
      Proven by the plans in plans/declines/.
    applies_to: [error, lastErrorCode, lastDeclineCode, lastErrorType]
    constraint: branch on error.code and error.decline_code, and retry only when advice_code allows it

  authentication:
    description: >-
      A card that requires 3D Secure stops the PaymentIntent at requires_action, with a redirect_to_url next action
      when a return_url is given, and it can't be captured until the customer authenticates (400
      payment_intent_unexpected_state). With error_on_requires_action, the confirmation is 402 authentication_required
      (decline code authentication_not_handled) and leaves the PaymentIntent open in requires_payment_method. Charged
      off session, a saved card that requires authentication is 402 authentication_required with decline code
      authentication_required, and leaves its PaymentIntent open the same way. Proven by
      plans/payments/three-d-secure.yaml and plans/setup-intents/authentication.yaml.
    applies_to: [nextActionType, returnUrl, errorOnRequiresAction]
    constraint: a refused confirmation still leaves a PaymentIntent to cancel

  refunds:
    description: >-
      Card refunds in test mode succeed at once, in full or in part, and partial refunds add up until the charge is
      refunded. More than remains is 400 on param amount with no code; a second full refund is 400
      charge_already_refunded; an authorization that wasn't captured can't be refunded (400, with no code or param) and
      is canceled instead. Refunds can't be deleted. Proven by plans/refunds/full-refund.yaml,
      plans/refunds/partial-refund.yaml, and plans/refunds/refund-limits.yaml.
    applies_to: [refundId, amount, reason, amountRefunded, refunded]
    # A refund of a bank transfer payment has to collect the customer's bank details by email, which needs a verified
    # account email, so this account refuses it. Only a refund waiting on the customer can be canceled or expired, so a
    # card refund refuses both. Proven by plans/refunds/refund-gates.yaml.

  incrementalAuthorization:
    description: >-
      Incremental authorization depends on the account. On this one, asking for it is 400
      payment_intent_invalid_parameter ("not eligible for the requested card features"), and incrementing an
      authorization that didn't ask for it is 400 with no code. Proven by plans/payments/increment-authorization.yaml.
    applies_to: [requestIncrementalAuthorization]

  search:
    description: >-
      Search endpoints take a query in Stripe's search language, such as email:'ada@example.com', and page with page, the
      previous response's next_page. Search lags behind lists: a new customer took 16 to 20 seconds to appear in two
      runs, while a list shows it at once. A field the resource can't be searched by is 400 invalid_request_error with
      no code or param. Proven by plans/customers/update-and-search.yaml.
    applies_to: [query, page, nextPage]
    constraint: poll a search until it finds a new object, or read a list instead
    # Customers took 16 to 20 seconds, PaymentIntents about 30, and charges were in the index sooner.
    # Also proven by plans/search/payment-intents-and-charges.yaml, which pages a search with next_page.

  customerBalance:
    description: >-
      A customer's balance changes through balance transactions. A negative amount is a credit and a positive one a
      debit; each is recorded as type adjustment, with the balance after it as ending_balance, and the list comes newest
      first. A transaction's description and metadata can change afterward, and the API has no delete for one. Proven by
      plans/customers/balance-transactions.yaml.
    applies_to: [customerBalanceTransactionId, amount, endingBalance, latestEndingBalance, balance]

  taxIds:
    description: >-
      A customer's tax ID takes its country from its value, and an eu_vat number starts with verification pending. A
      value its type rejects is 400 tax_id_invalid on param value, and deleting a deleted tax ID is 404
      resource_missing on param id. Proven by plans/customers/tax-ids.yaml.
    applies_to: [taxId, type, value, country, verificationStatus]

  paymentMethods:
    description: >-
      A PaymentMethod made from a test token such as tok_visa belongs to no customer until it is attached. Attaching a
      test ID such as pm_card_mastercard makes a new PaymentMethod with an ID of its own. Detaching is for good:
      attaching it again and detaching it again are both 400 invalid_request_error with no code, and reading it under
      the customer is 404 on param customer. Proven by plans/payment-methods/attach-and-detach.yaml.
    applies_to: [paymentMethodId, customerId, cardBrand, cardLast4, billingName, allowRedisplay]
    constraint: use the ID an attach returns, not the test ID it was sent

  setupIntents:
    description: >-
      A SetupIntent saves a payment method for later without charging it. Confirmed with a card for off_session usage,
      it succeeds with one setup attempt, and the customer holds a new PaymentMethod that pays a PaymentIntent confirmed
      off session. Without a card it waits in requires_payment_method, can be updated, and succeeds when confirmed with
      one. It can be canceled only while requires_payment_method, requires_confirmation, or requires_action; a
      succeeded or canceled one is 400 setup_intent_unexpected_state. A card that needs authentication on setup stops
      it at requires_action with a redirect_to_url next action, and a declined card is 402 card_declined that still
      leaves the SetupIntent open. Proven by plans/setup-intents/saved-card.yaml,
      plans/setup-intents/update-confirm-cancel.yaml, and plans/setup-intents/authentication.yaml.
    applies_to: [setupIntentId, status, usage, latestAttemptId, cancellationReason, offSession]
    constraint: read a SetupIntent's status before canceling it, and cancel only one still open

  achDebits:
    description: >-
      A US bank account is charged through a PaymentIntent with payment_method_types us_bank_account, and it needs the
      customer's mandate: without mandate_data the create is 400, and it still leaves a PaymentIntent in
      requires_confirmation. An account given by its numbers is verified first, so the PaymentIntent waits in
      requires_action with a verify_with_microdeposits next action, whose microdeposit_type here is descriptor_code. The
      test descriptor code is SM11AA; a wrong one is payment_method_microdeposit_verification_descriptor_code_mismatch,
      one amount is payment_method_microdeposit_verification_amounts_invalid on param amounts, and verifying an intent
      that isn't waiting is payment_intent_unexpected_state, or intent_invalid_state on a SetupIntent. A debit is not
      instant: it goes through processing and settles about 20 seconds later, or fails with insufficient_funds or
      account_closed on last_payment_error. Proven by the plans in plans/ach/.
    applies_to: [routingNumber, accountNumber, microdepositType, descriptorCode, amounts, verificationMethod]
    constraint: collect mandate acceptance, verify the deposits, then read the payment until it leaves processing

  mandates:
    description: >-
      A mandate is the customer's authorization for a debit, and Stripe records how it was accepted, with the IP address
      and user agent given as mandate_data. A SetupIntent's mandate is multi_use and stays active, and a later
      off-session debit on that payment method reuses it with nothing to collect again. A single payment's mandate is
      single_use. A SEPA mandate carries a reference. An unknown mandate is 404 resource_missing on param mandate.
      Proven by plans/ach/saved-bank-account.yaml and plans/sepa/direct-debit.yaml.
    applies_to: [mandateId, acceptanceType, acceptanceIp, acceptanceUserAgent]

  sepaDirectDebit:
    description: >-
      A SEPA debit is taken in euros from an IBAN, with mandate acceptance, and goes through processing rather than
      succeeding at once: about 15 seconds in test mode. The country and bank code come from the IBAN. Stripe's failing
      test IBAN is accepted the same way and fails afterward, with last_payment_error
      payment_intent_payment_attempt_failed and the reason on the charge. Proven by plans/sepa/direct-debit.yaml.
    applies_to: [iban, bankCode, chargeFailureCode]

  cashBalance:
    description: >-
      A customer can pay by bank transfer into a cash balance. Funding instructions give the bank details to pay into,
      the same ones again for the same customer, in a response whose bank_transfer.type Stripe's own spec doesn't
      describe, so drift/funding-instructions.yaml reads them with findings reported rather than failing. A test helper
      pretends the transfer arrived. With reconciliation
      automatic a payment takes what it needs as the money is there, or takes part and waits with the amount_remaining;
      with manual it waits for apply_customer_balance, which refuses more than remains, another currency, a payment
      already paid, and a payment that isn't a customer_balance one. An amount below 1 is parameter_invalid_integer, and
      a mode that isn't automatic, manual, or merchant_default is refused on param settings[reconciliation_mode]. A
      customer with a positive cash balance can't be deleted, so a plan spends it first. Proven by the plans in
      plans/cash-balance/.
    applies_to: [availableUsd, reconciliationMode, amountRemaining, bankTransferType, fundingType]
    constraint: spend a cash balance to zero before deleting the customer

  tokens:
    description: >-
      A token holds one thing once: a bank account (btok_), a PII number (pii_), or a CVC collected again (cvctok_).
      Exactly one kind per request, so none is parameter_missing and two is refused with no code, and a raw card number
      is refused as it is on PaymentMethods. A CVC token spent on a payment reads back used, and using it again is 400
      token_already_used, which still leaves a PaymentIntent. An unknown token is 400 resource_missing on param token,
      not 404. Proven by plans/tokens/tokens.yaml.
    applies_to: [tokenId, used, idNumber, cvc]

  confirmationTokens:
    description: >-
      A ConfirmationToken carries what Stripe.js collected in the browser, and a test helper makes one without a
      browser. It lasts 12 hours, previews its payment method, and confirms exactly one PaymentIntent: a second
      confirmation is 400 payment_intent_confirmation_token_invalid, and a setup_future_usage that doesn't match the
      PaymentIntent's is refused on that param. A token that asks to save the card leaves the customer holding it.
      An unknown token is 404 resource_missing on param confirmation_token. Proven by
      plans/confirmation-tokens/confirm-and-save.yaml.
    applies_to: [confirmationTokenId, setupFutureUsage, previewType, expiresAt]
