version: "1.0.0"
title: Stripe (test mode)
description: >-
  Stripe's REST API at https://api.stripe.com, in test mode. Requests are form-encoded, with
  bracketed keys for nested fields (metadata[source]=aat-stripe), and authenticated with the secret
  key as a bearer token; responses are JSON. Errors share one envelope, {"error": {"type", "code",
  "decline_code", "param", "message"}}, and an unknown ID is 404 resource_missing. Lists come newest
  first and page with starting_after, the last ID of the previous page, until has_more is false.
  Every node names its operation in Stripe's own OpenAPI spec, and the pinned environments check
  each request and response against it.

oas: openapi/spec3.json

nodes:
  # --- Account and balance ---------------------------------------------------------------------

  getAccount:
    description: >-
      Read the account the secret key belongs to (GET /v1/account, 200): its country, default
      currency, and type, whether it can take charges and pay out, and the state of the
      card_payments and transfers capabilities. The account object has no livemode field; the
      balance has one.
    adapter: getAccount
    tags: [account]
    oas:
      operationId: GetAccount
    outputs:
      - name: accountId
        type: string
        display: Account
      - name: country
        type: string
        display: Country
      - name: accountType
        type: string
        description: standard, express, custom, or none
      - name: defaultCurrency
        type: string
      - name: chargesEnabled
        type: boolean
      - name: payoutsEnabled
        type: boolean
      - name: detailsSubmitted
        type: boolean
      - name: cardPayments
        type: string
        description: The card_payments capability, such as active or pending; "" when the account has none
      - name: transfers
        type: string
        description: The transfers capability, such as active or pending; "" when the account has none
      - name: controllerType
        type: string
        description: account for an account that controls itself, application for a connected account; "" when absent

  getBalance:
    description: >-
      Read the balance (GET /v1/balance, 200), per currency, as available (ready to pay out) and
      pending. Amounts are integers in the currency's smallest unit. livemode is false for a test
      key, so a plan can check it before anything is created.
    adapter: getBalance
    tags: [balance]
    oas:
      operationId: GetBalance
    outputs:
      - name: livemode
        type: boolean
      - name: availableUsd
        type: integer
        display: Available USD
        description: The available USD amount in cents; 0 when the balance has no USD entry
      - name: pendingUsd
        type: integer
        display: Pending USD
        description: The pending USD amount in cents; 0 when the balance has no USD entry
      - name: currencyCount
        type: integer
        description: How many currencies the available balance lists

  listBalanceTransactions:
    description: >-
      Page through the balance transactions (GET /v1/balance_transactions, 200), newest first: each
      charge, refund, fee, payout, and transfer that moved the balance. limit is 1 to 100, and
      filters narrow the list to one type (charge, refund, payout, ...) or to transactions created at
      or after a Unix time. The older path /v1/balance/history answers the same list and isn't used.
    adapter: listBalanceTransactions
    tags: [balance, pagination]
    oas:
      operationId: GetBalanceTransactions
    inputs:
      - name: limit
        type: integer
        default: 10
        description: Transactions per page, 1 to 100
        constraints:
          min: 1
          max: 100
      - name: startingAfter
        type: string
        optional: true
        description: The previous page's lastId
      - name: transactionType
        type: string
        optional: true
        description: Only transactions of this type, such as charge or refund
      - name: createdGte
        type: integer
        optional: true
        description: Only transactions created at or after this Unix time
    outputs:
      - name: transactions
        type: balanceTransaction[]
        elementFields:
          - name: id
            type: string
          - name: type
            type: string
          - name: amount
            type: integer
          - name: currency
            type: string
          - name: status
            type: string
      - name: count
        type: integer
        display: Transactions
      - name: hasMore
        type: boolean
      - name: firstId
        type: string
        description: The newest ID on the page; "" on an empty page
      - name: lastId
        type: string
        description: The oldest ID on the page, which the next page starts after; "" on an empty page

  getBalanceTransaction:
    description: >-
      Read one balance transaction by its txn_ ID (GET /v1/balance_transactions/{id}, 200). net is
      the amount less the fee, and source is the ID of the object that moved the balance, such as a
      ch_ charge or a re_ refund.
    adapter: getBalanceTransaction
    tags: [balance]
    oas:
      operationId: GetBalanceTransactionsId
    inputs:
      - name: balanceTransactionId
        type: string
        description: The txn_ ID
        default:
          from: listBalanceTransactions.transactions
          select:
            strategy: first
            field: id
    outputs:
      - name: balanceTransactionId
        type: string
        display: Transaction
      - name: transactionType
        type: string
        display: Type
      - name: amount
        type: integer
      - name: fee
        type: integer
      - name: net
        type: integer
      - name: currency
        type: string
      - name: status
        type: string
        description: available or pending
      - name: reportingCategory
        type: string
      - name: source
        type: string
        description: The ID of the object behind the transaction; "" when there is none
      - name: created
        type: integer
      - name: availableOn
        type: integer

  getBalanceSettings:
    description: >-
      Read the balance settings (GET /v1/balance_settings, 200): whether a negative balance is
      debited from the bank account, the payout schedule, and how many days a charge takes to settle.
    adapter: getBalanceSettings
    tags: [balance, settings]
    oas:
      operationId: GetBalanceSettings
    outputs:
      - name: debitNegativeBalances
        type: boolean
      - name: payoutInterval
        type: string
        display: Payouts
        description: manual, daily, weekly, or monthly; "" when no schedule is set
      - name: payoutStatus
        type: string
        description: enabled or disabled; "" when absent
      - name: settlementDelayDays
        type: integer
        description: Days before a charge's funds become available; 0 when absent

  updateBalanceSettings:
    description: >-
      Update the balance settings (POST /v1/balance_settings, 200). Only the fields given are sent;
      the payout interval defaults to the one getBalanceSettings read, so the node writes back what
      is there unless a plan says otherwise. An activated account can't change
      payments[debit_negative_balances] through the API at all: 400 invalid_request_error with that
      param, even when the value is unchanged. The response is the settings after the update.
    adapter: updateBalanceSettings
    tags: [balance, settings]
    oas:
      operationId: PostBalanceSettings
    inputs:
      - name: debitNegativeBalances
        type: boolean
        optional: true
        description: Refused on an activated account
      - name: payoutInterval
        type: string
        optional: true
        description: manual, daily, weekly, or monthly
        default:
          from: getBalanceSettings.payoutInterval
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
        description: The Idempotency-Key header; a retried request answers with the first response
    outputs:
      - name: debitNegativeBalances
        type: boolean
      - name: payoutInterval
        type: string
        display: Payouts
      - name: payoutStatus
        type: string
      - name: settlementDelayDays
        type: integer

  # --- Reference data --------------------------------------------------------------------------

  listCountrySpecs:
    description: >-
      Page through the country specs (GET /v1/country_specs, 200): one for each country a Stripe
      account can be in, with its default currency. limit is 1 to 100. A page of 100 has taken from
      1 to 20 seconds.
    adapter: listCountrySpecs
    tags: [reference, pagination]
    oas:
      operationId: GetCountrySpecs
    inputs:
      - name: limit
        type: integer
        default: 100
        description: Countries per page, 1 to 100
        constraints:
          min: 1
          max: 100
      - name: startingAfter
        type: string
        optional: true
        description: The previous page's lastId
    outputs:
      - name: countries
        type: countrySpec[]
        elementFields:
          - name: id
            type: string
          - name: defaultCurrency
            type: string
      - name: count
        type: integer
        display: Countries
      - name: hasMore
        type: boolean
      - name: lastId
        type: string
        description: The last country code on the page; "" on an empty page

  getCountrySpec:
    description: >-
      Read one country's spec by its two-letter code (GET /v1/country_specs/{country}, 200): its
      default currency, and how many currencies payments can be in, countries it can transfer to, and
      payment methods it lists.
    adapter: getCountrySpec
    tags: [reference]
    oas:
      operationId: GetCountrySpecsCountry
    inputs:
      - name: country
        type: string
        default: US
        description: An ISO 3166-1 alpha-2 country code
    outputs:
      - name: country
        type: string
        display: Country
      - name: defaultCurrency
        type: string
      - name: paymentCurrencyCount
        type: integer
      - name: transferCountryCount
        type: integer
      - name: paymentMethodCount
        type: integer

  listTaxCodes:
    description: >-
      Page through Stripe Tax's product tax codes (GET /v1/tax_codes, 200), a fixed catalog of
      txcd_ codes. limit is 1 to 100.
    adapter: listTaxCodes
    tags: [reference, tax, pagination]
    oas:
      operationId: GetTaxCodes
    inputs:
      - name: limit
        type: integer
        default: 100
        description: Codes per page, 1 to 100
        constraints:
          min: 1
          max: 100
      - name: startingAfter
        type: string
        optional: true
        description: The previous page's lastId
    outputs:
      - name: taxCodes
        type: taxCode[]
        elementFields:
          - name: id
            type: string
          - name: name
            type: string
      - name: count
        type: integer
        display: Tax codes
      - name: hasMore
        type: boolean
      - name: lastId
        type: string
        description: The last code on the page; "" on an empty page

  getTaxCode:
    description: >-
      Read one product tax code by its txcd_ ID (GET /v1/tax_codes/{id}, 200). txcd_10000000 is the
      general code for electronically supplied services, the account's default.
    adapter: getTaxCode
    tags: [reference, tax]
    oas:
      operationId: GetTaxCodesId
    inputs:
      - name: taxCodeId
        type: string
        default: txcd_10000000
        description: The txcd_ ID
    outputs:
      - name: taxCodeId
        type: string
        display: Tax code
      - name: name
        type: string
      - name: description
        type: string

  # --- Events ----------------------------------------------------------------------------------

  listEvents:
    description: >-
      Page through the account's events (GET /v1/events, 200), newest first, going back 30 days.
      eventType takes one type, or a group with a wildcard such as customer.*, and createdGte a Unix
      time. Each event names the object it is about, the API request that caused it, and that
      request's Idempotency-Key. An event is rendered at the account's default API version, even
      when the request that caused it pinned another.
    adapter: listEvents
    tags: [events, pagination]
    oas:
      operationId: GetEvents
    inputs:
      - name: limit
        type: integer
        default: 10
        description: Events per page, 1 to 100
        constraints:
          min: 1
          max: 100
      - name: startingAfter
        type: string
        optional: true
        description: The previous page's lastId
      - name: eventType
        type: string
        optional: true
        description: Only events of this type, such as customer.created, or a group such as customer.*
      - name: createdGte
        type: integer
        optional: true
        description: Only events created at or after this Unix time
    outputs:
      - name: events
        type: event[]
        elementFields:
          - name: id
            type: string
          - name: type
            type: string
          - name: objectId
            type: string
          - name: requestId
            type: string
          - name: apiVersion
            type: string
      - name: count
        type: integer
        display: Events
      - name: hasMore
        type: boolean
      - name: lastId
        type: string
        description: The oldest ID on the page; "" on an empty page

  getEvent:
    description: >-
      Read one event by its evt_ ID (GET /v1/events/{id}, 200): its type, the API version its data is
      rendered at, the object it is about, and the request that caused it.
    adapter: getEvent
    tags: [events]
    oas:
      operationId: GetEventsId
    inputs:
      - name: eventId
        type: string
        description: The evt_ ID
        default:
          from: listEvents.events
          select:
            strategy: first
            field: id
    outputs:
      - name: eventId
        type: string
        display: Event
      - name: eventType
        type: string
        display: Type
      - name: apiVersion
        type: string
      - name: livemode
        type: boolean
      - name: created
        type: integer
      - name: objectId
        type: string
        description: The ID of the object the event is about; "" when it has none
      - name: objectType
        type: string
        description: The object's type, such as customer; "" when absent
      - name: requestId
        type: string
        description: The req_ ID of the API request behind the event; "" for an event nothing requested
      - name: idempotencyKey
        type: string
        description: That request's Idempotency-Key; "" when it sent none

  # --- Customers -------------------------------------------------------------------------------

  createCustomer:
    description: >-
      Create a customer (POST /v1/customers, 200). Every customer the package creates carries
      metadata[source]=aat-stripe and a fresh Idempotency-Key. Sending the key again with the same
      parameters answers with the first customer, with Idempotent-Replayed: true and Original-Request
      naming the first request; other parameters, or another endpoint, are 400 idempotency_error.
      Cleanup deletes the customer, except after a replay, whose customer the first request's
      cleanup deletes.
    adapter: createCustomer
    tags: [customers]
    oas:
      operationId: PostCustomers
    inputs:
      - name: email
        type: string
        default: "aat-stripe-{{random 10}}@example.com"
        description: A fresh address in a domain reserved for examples
      - name: name
        type: string
        default: AAT Stripe customer
      - name: description
        type: string
        optional: true
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
        description: The Idempotency-Key header; a retried create answers with the first customer
    outputs:
      - name: customerId
        type: string
        display: Customer
      - name: email
        type: string
      - name: name
        type: string
      - name: livemode
        type: boolean
      - name: created
        type: integer
      - name: source
        type: string
        description: metadata.source, aat-stripe for every customer the package creates
      - name: testClock
        type: string
        description: The test clock the customer runs on; "" for none
      - name: idempotentReplayed
        type: boolean
        description: The Idempotent-Replayed response header; false when Stripe sends none
      - name: requestId
        type: string
        description: The Request-Id response header, the req_ ID events name
      - name: originalRequest
        type: string
        description: The Original-Request header, the request that first sent the key; this request's own ID unless it is a replay
      - name: stripeVersion
        type: string
        description: The Stripe-Version response header, the API version Stripe answered at
    # A live key would create a real customer; stop at the first one.
    errorDetection:
      - path: livemode
        rule: equals
        value: true
    cleanup:
      node: deleteCustomer
      when: idempotentReplayed == false

  getCustomer:
    description: >-
      Read a customer by its cus_ ID (GET /v1/customers/{customer}, 200). A deleted customer still
      answers 200, with only id, object, and deleted: true; an ID that never existed is 404
      resource_missing with param id.
    adapter: getCustomer
    tags: [customers]
    oas:
      operationId: GetCustomersCustomer
    inputs:
      - name: customerId
        type: string
        description: The cus_ ID
        default:
          from: createCustomer.customerId
    outputs:
      - name: customerId
        type: string
        display: Customer
      - name: deleted
        type: boolean
        description: true for a deleted customer; false otherwise
      - name: email
        type: string
        description: '"" for a deleted customer or one without an email'
      - name: name
        type: string
      - name: livemode
        type: boolean
      - name: source
        type: string
        description: metadata.source; "" when absent
      - name: testClock
        type: string
        description: The test clock the customer runs on; "" for none

  listCustomers:
    description: >-
      Page through the customers (GET /v1/customers, 200), newest first. limit is 1 to 100, and
      filters narrow the list to one email or to customers created at or after a Unix time. A deleted
      customer is no longer listed. Each page counts the customers this package created
      (metadata.source aat-stripe), and lists them so a guard that fails can name them.
    adapter: listCustomers
    tags: [customers, pagination]
    oas:
      operationId: GetCustomers
    inputs:
      - name: limit
        type: integer
        default: 10
        description: Customers per page, 1 to 100
        constraints:
          min: 1
          max: 100
      - name: startingAfter
        type: string
        optional: true
        description: The previous page's lastId
      - name: email
        type: string
        optional: true
        description: Only customers with exactly this email
      - name: createdGte
        type: integer
        optional: true
        description: Only customers created at or after this Unix time
    outputs:
      - name: customers
        type: customer[]
        elementFields:
          - name: id
            type: string
          - name: email
            type: string
      - name: count
        type: integer
        display: Customers
      - name: hasMore
        type: boolean
      - name: lastId
        type: string
        description: The oldest ID on the page; "" on an empty page
      - name: ourCount
        type: integer
        display: Ours
        description: Customers on the page this package created
      - name: ourCustomers
        type: ourCustomer[]
        optional: true
        description: The package's customers on the page, when there are any
        elementFields:
          - name: id
            type: string
          - name: email
            type: string
          - name: created
            type: integer
      - name: liveCount
        type: integer
        description: Customers in live mode on the page; 0 for a test key

  deleteCustomer:
    description: >-
      Delete a customer for good (DELETE /v1/customers/{customer}, 200, deleted: true). Deleting one
      already deleted is 404 resource_missing with param id. The cleanup for createCustomer.
    adapter: deleteCustomer
    tags: [customers, cleanup]
    oas:
      operationId: DeleteCustomersCustomer
    inputs:
      - name: customerId
        type: string
        description: The cus_ ID
        default:
          from: createCustomer.customerId
    outputs:
      - name: customerId
        type: string
        display: Deleted
      - name: deleted
        type: boolean

  # --- PaymentIntents --------------------------------------------------------------------------

  createPaymentIntent:
    description: >-
      Create a PaymentIntent (POST /v1/payment_intents, 200), the object that tracks one payment from
      creation to capture. Amounts are integers in the currency's smallest unit (cents, or whole yen
      for jpy). With confirm true it is confirmed at once with the payment method; with
      capture_method manual a successful confirmation stops at requires_capture. A decline on a
      confirming create is 402 and leaves no PaymentIntent ID in a success response, so decline
      plans create first and confirm after. Every PaymentIntent the package creates carries
      metadata[source]=aat-stripe, and metadata[expected_brand] when a plan names the brand its
      card should have. Cleanup reads it and cancels it while it is still open.
    adapter: createPaymentIntent
    tags: [payments]
    oas:
      operationId: PostPaymentIntents
    inputs:
      - name: amount
        type: integer
        default: 2000
        description: The amount in the currency's smallest unit
      - name: currency
        type: string
        default: usd
      - name: customerId
        type: string
        optional: true
        default:
          from: createCustomer.customerId
      - name: paymentMethod
        type: string
        optional: true
        default: pm_card_visa
        description: A payment method ID, or a test one such as pm_card_visa; {} for none yet
      - name: paymentMethodTypes
        type: string[]
        default:
          value: [card]
        description: The payment method types it accepts
      - name: captureMethod
        type: string
        optional: true
        description: automatic (the default), automatic_async, or manual
      - name: confirm
        type: boolean
        optional: true
      - name: returnUrl
        type: string
        optional: true
        description: Where a customer returns after authentication, for redirect-based next actions
      - name: errorOnRequiresAction
        type: boolean
        optional: true
      - name: offSession
        type: boolean
        optional: true
      - name: setupFutureUsage
        type: string
        optional: true
        description: on_session or off_session, to save the payment method for later
      - name: confirmationToken
        type: string
        optional: true
        description: A ctoken_ ID, which carries the payment method instead of paymentMethod
      - name: cvcToken
        type: string
        optional: true
        description: A cvctok_ ID, the CVC collected again for a saved card
      - name: requestIncrementalAuthorization
        type: string
        optional: true
        description: if_available or never, for a card authorization that may be incremented
      - name: description
        type: string
        optional: true
      - name: expectedBrand
        type: string
        optional: true
        default: visa
        description: The card brand the plan expects, stored as metadata[expected_brand]; the default card's is visa
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
        description: The Idempotency-Key header
    outputs: &paymentIntentOutputs
      - name: paymentIntentId
        type: string
        display: PaymentIntent
      - name: status
        type: string
        display: Status
      - name: amount
        type: integer
      - name: currency
        type: string
      - name: amountCapturable
        type: integer
      - name: amountReceived
        type: integer
      - name: captureMethod
        type: string
      - name: livemode
        type: boolean
      - name: customerId
        type: string
        description: The customer's cus_ ID; "" for none
      - name: paymentMethodId
        type: string
        description: The pm_ ID of the payment method; "" for none
      - name: latestChargeId
        type: string
        description: The ch_ or py_ ID of the latest charge; "" before a charge
      - name: cardBrand
        type: string
        description: The latest charge's card brand, such as visa; "" without a card charge
      - name: nextActionType
        type: string
        description: What the customer must do next, such as redirect_to_url; "" for nothing
      - name: lastErrorCode
        type: string
        description: The last payment error's code, such as card_declined; "" for none
      - name: lastDeclineCode
        type: string
        description: The last payment error's decline code, such as insufficient_funds; "" for none
      - name: cancellationReason
        type: string
        description: Why it was canceled; "" while it isn't
      - name: expectedBrand
        type: string
        description: metadata.expected_brand; "" when the plan named none
      - name: source
        type: string
        description: metadata.source, aat-stripe for every PaymentIntent the package creates
    errorDetection:
      - path: livemode
        rule: equals
        value: true
    cleanup:
      node: getPaymentIntentForCleanup
      releasedBy: [cancelPaymentIntent]

  getPaymentIntent:
    description: >-
      Read a PaymentIntent with its latest charge expanded (GET /v1/payment_intents/{intent}, 200):
      its status and amounts, the charge's card brand, country, and funding, the charge's outcome and
      risk level, and what was refunded. A declined confirmation leaves it requires_payment_method
      with last_payment_error set; a successful one leaves last_payment_error null.
    adapter: getPaymentIntent
    tags: [payments]
    oas:
      operationId: GetPaymentIntentsIntent
    inputs:
      - name: paymentIntentId
        type: string
        description: The pi_ ID
        default:
          from: createPaymentIntent.paymentIntentId
    outputs:
      - name: paymentIntentId
        type: string
        display: PaymentIntent
      - name: status
        type: string
        display: Status
      - name: amount
        type: integer
      - name: currency
        type: string
      - name: amountCapturable
        type: integer
      - name: amountReceived
        type: integer
      - name: captureMethod
        type: string
      - name: livemode
        type: boolean
      - name: customerId
        type: string
      - name: paymentMethodId
        type: string
      - name: latestChargeId
        type: string
      - name: cardBrand
        type: string
      - name: cardCountry
        type: string
        description: The card's issuing country; "" without a card charge
      - name: cardFunding
        type: string
        description: credit, debit, prepaid, or unknown; "" without a card charge
      - name: chargeStatus
        type: string
        description: succeeded, pending, or failed; "" before a charge
      - name: captured
        type: boolean
      - name: amountRefunded
        type: integer
      - name: refunded
        type: boolean
        description: Whether the latest charge is refunded in full
      - name: outcomeType
        type: string
        description: authorized, manual_review, issuer_declined, blocked, or invalid; "" before a charge
      - name: riskLevel
        type: string
        description: normal, elevated, or highest; "" before a charge
      - name: nextActionType
        type: string
      - name: lastErrorType
        type: string
        description: The last payment error's type, such as card_error; "" for none
      - name: lastErrorCode
        type: string
      - name: lastDeclineCode
        type: string
      - name: cancellationReason
        type: string
      - name: expectedBrand
        type: string
      - name: source
        type: string

  getPaymentIntentForCleanup:
    description: >-
      Read a PaymentIntent's status for cleanup (GET /v1/payment_intents/{intent}, 200), so the
      cancel that follows runs only while it can: in requires_payment_method, requires_confirmation,
      requires_action, or requires_capture. A succeeded or canceled PaymentIntent is 400
      payment_intent_unexpected_state to a cancel.
    adapter: getPaymentIntentForCleanup
    tags: [payments, cleanup]
    oas:
      operationId: GetPaymentIntentsIntent
    inputs:
      - name: paymentIntentId
        type: string
        default:
          from: createPaymentIntent.paymentIntentId
    outputs:
      - name: paymentIntentId
        type: string
      - name: status
        type: string
        display: Status
    cleanup:
      node: cancelPaymentIntent
      when: 'status in ["requires_payment_method", "requires_confirmation", "requires_action", "requires_capture"]'

  updatePaymentIntent:
    description: >-
      Update a PaymentIntent (POST /v1/payment_intents/{intent}, 200): its amount, while it isn't
      yet captured, and its description and metadata note.
    adapter: updatePaymentIntent
    tags: [payments]
    oas:
      operationId: PostPaymentIntentsIntent
    inputs:
      - name: paymentIntentId
        type: string
        default:
          from: createPaymentIntent.paymentIntentId
      - name: amount
        type: integer
        optional: true
      - name: description
        type: string
        optional: true
      - name: note
        type: string
        optional: true
        description: Stored as metadata[note]
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs:
      - name: paymentIntentId
        type: string
        display: PaymentIntent
      - name: status
        type: string
      - name: amount
        type: integer
      - name: description
        type: string
        description: '"" for none'
      - name: note
        type: string
        description: metadata.note; "" for none

  confirmPaymentIntent:
    description: >-
      Confirm a PaymentIntent with a payment method (POST /v1/payment_intents/{intent}/confirm,
      200). Allowed while it is requires_payment_method, requires_confirmation, or requires_action.
      A declined card is 402 card_error with code and decline_code, and leaves the PaymentIntent
      requires_payment_method, ready to confirm again with another card.
    adapter: confirmPaymentIntent
    tags: [payments]
    oas:
      operationId: PostPaymentIntentsIntentConfirm
    inputs:
      - name: paymentIntentId
        type: string
        default:
          from: createPaymentIntent.paymentIntentId
      - name: paymentMethod
        type: string
        optional: true
      - name: returnUrl
        type: string
        optional: true
      - name: errorOnRequiresAction
        type: boolean
        optional: true
      - name: offSession
        type: boolean
        optional: true
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs: *paymentIntentOutputs

  capturePaymentIntent:
    description: >-
      Capture an authorized PaymentIntent (POST /v1/payment_intents/{intent}/capture, 200). Only one
      that is requires_capture can be captured. Without amount_to_capture it captures in full; a
      smaller amount captures that much and releases the rest, and the PaymentIntent ends succeeded
      either way.
    adapter: capturePaymentIntent
    tags: [payments]
    oas:
      operationId: PostPaymentIntentsIntentCapture
    inputs:
      - name: paymentIntentId
        type: string
        default:
          from: createPaymentIntent.paymentIntentId
      - name: amountToCapture
        type: integer
        optional: true
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs: *paymentIntentOutputs

  cancelPaymentIntent:
    description: >-
      Cancel a PaymentIntent (POST /v1/payment_intents/{intent}/cancel, 200) while it is
      requires_payment_method, requires_confirmation, requires_action, or requires_capture; an
      uncaptured authorization is released. The cleanup for an open PaymentIntent.
    adapter: cancelPaymentIntent
    tags: [payments, cleanup]
    oas:
      operationId: PostPaymentIntentsIntentCancel
    inputs:
      - name: paymentIntentId
        type: string
        default:
          from: createPaymentIntent.paymentIntentId
      - name: cancellationReason
        type: string
        optional: true
        description: abandoned, duplicate, fraudulent, or requested_by_customer
    outputs: *paymentIntentOutputs

  incrementAuthorization:
    description: >-
      Raise the amount of an uncaptured card authorization (POST
      /v1/payment_intents/{intent}/increment_authorization, 200). The PaymentIntent must have asked
      for incremental authorization when it was confirmed, and the amount is the new total.
    adapter: incrementAuthorization
    tags: [payments]
    oas:
      operationId: PostPaymentIntentsIntentIncrementAuthorization
    inputs:
      - name: paymentIntentId
        type: string
        default:
          from: createPaymentIntent.paymentIntentId
      - name: amount
        type: integer
        description: The new, higher total to authorize
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs: *paymentIntentOutputs

  listPaymentIntents:
    description: >-
      Page through PaymentIntents (GET /v1/payment_intents, 200), newest first, narrowed to one
      customer or to those created at or after a Unix time. Each page counts the PaymentIntents this
      package created and those of them still open, and lists the open ones so a guard that fails
      can name them.
    adapter: listPaymentIntents
    tags: [payments, pagination]
    oas:
      operationId: GetPaymentIntents
    inputs:
      - name: limit
        type: integer
        default: 10
        constraints:
          min: 1
          max: 100
      - name: startingAfter
        type: string
        optional: true
      - name: customerId
        type: string
        optional: true
      - name: createdGte
        type: integer
        optional: true
    outputs:
      - name: paymentIntents
        type: paymentIntent[]
        elementFields:
          - name: id
            type: string
          - name: status
            type: string
          - name: amount
            type: integer
      - name: count
        type: integer
        display: PaymentIntents
      - name: hasMore
        type: boolean
      - name: lastId
        type: string
      - name: ourCount
        type: integer
        display: Ours
      - name: ourOpenCount
        type: integer
        display: Ours still open
        description: The package's PaymentIntents in a requires_ state, which cleanup should have canceled
      - name: ourOpen
        type: openPaymentIntent[]
        optional: true
        elementFields:
          - name: id
            type: string
          - name: status
            type: string
          - name: created
            type: integer
      - name: liveCount
        type: integer

  # --- Refunds and charges ---------------------------------------------------------------------

  createRefund:
    description: >-
      Refund a payment (POST /v1/refunds, 200), in full or in part, by its PaymentIntent or charge.
      Card refunds in test mode succeed at once. Refunding more than remains is 400
      invalid_request_error on param amount. Refunds can't be deleted.
    adapter: createRefund
    tags: [refunds]
    oas:
      operationId: PostRefunds
    inputs:
      - name: paymentIntentId
        type: string
        optional: true
        default:
          from: createPaymentIntent.paymentIntentId
      - name: chargeId
        type: string
        optional: true
      - name: amount
        type: integer
        optional: true
        description: The amount to refund; the whole remaining amount when left out
      - name: reason
        type: string
        optional: true
        description: duplicate, fraudulent, or requested_by_customer
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs: &refundOutputs
      - name: refundId
        type: string
        display: Refund
      - name: status
        type: string
        display: Status
      - name: amount
        type: integer
      - name: currency
        type: string
      - name: paymentIntentId
        type: string
        description: '"" for a refund without one'
      - name: chargeId
        type: string
      - name: reason
        type: string
        description: '"" for none'
      - name: failureReason
        type: string
        description: Why a failed refund failed; "" otherwise
      - name: pendingReason
        type: string
        description: Why a pending refund is pending; "" otherwise
      - name: source
        type: string
        description: metadata.source

  getRefund:
    description: Read a refund by its re_ ID (GET /v1/refunds/{refund}, 200), to follow one that is pending.
    adapter: getRefund
    tags: [refunds]
    oas:
      operationId: GetRefundsRefund
    inputs:
      - name: refundId
        type: string
        default:
          from: createRefund.refundId
    outputs: *refundOutputs

  updateRefund:
    description: Update a refund's metadata note (POST /v1/refunds/{refund}, 200); nothing else of a refund changes.
    adapter: updateRefund
    tags: [refunds]
    oas:
      operationId: PostRefundsRefund
    inputs:
      - name: refundId
        type: string
        default:
          from: createRefund.refundId
      - name: note
        type: string
        description: Stored as metadata[note]
    outputs:
      - name: refundId
        type: string
        display: Refund
      - name: note
        type: string

  listRefunds:
    description: >-
      Page through refunds (GET /v1/refunds, 200), newest first, narrowed to one PaymentIntent or one
      charge.
    adapter: listRefunds
    tags: [refunds, pagination]
    oas:
      operationId: GetRefunds
    inputs:
      - name: limit
        type: integer
        default: 10
        constraints:
          min: 1
          max: 100
      - name: startingAfter
        type: string
        optional: true
      - name: paymentIntentId
        type: string
        optional: true
      - name: chargeId
        type: string
        optional: true
    outputs:
      - name: refunds
        type: refund[]
        elementFields:
          - name: id
            type: string
          - name: status
            type: string
          - name: amount
            type: integer
      - name: count
        type: integer
        display: Refunds
      - name: hasMore
        type: boolean
      - name: lastId
        type: string
      - name: totalAmount
        type: integer
        description: The refunds' amounts added up

  getCharge:
    description: >-
      Read a charge by its ch_ or py_ ID (GET /v1/charges/{charge}, 200): its amounts captured and
      refunded, its card's brand, country, funding, and last four digits, and its outcome and risk
      level.
    adapter: getCharge
    tags: [charges]
    oas:
      operationId: GetChargesCharge
    inputs:
      - name: chargeId
        type: string
        default:
          from: getPaymentIntent.latestChargeId
    outputs:
      - name: chargeId
        type: string
        display: Charge
      - name: status
        type: string
        display: Status
      - name: amount
        type: integer
      - name: amountCaptured
        type: integer
      - name: amountRefunded
        type: integer
      - name: currency
        type: string
      - name: captured
        type: boolean
      - name: refunded
        type: boolean
      - name: paid
        type: boolean
      - name: disputed
        type: boolean
      - name: livemode
        type: boolean
      - name: paymentIntentId
        type: string
      - name: balanceTransactionId
        type: string
        description: The txn_ ID; "" before the charge has one
      - name: cardBrand
        type: string
      - name: cardCountry
        type: string
      - name: cardFunding
        type: string
      - name: cardLast4
        type: string
      - name: outcomeType
        type: string
      - name: riskLevel
        type: string
      - name: networkStatus
        type: string
        description: approved_by_network, declined_by_network, not_sent_to_network, or reversed_after_approval
      - name: failureCode
        type: string
        description: '"" for a charge that didn''t fail'

  listCharges:
    description: >-
      Page through charges (GET /v1/charges, 200), newest first, narrowed to one PaymentIntent or one
      customer.
    adapter: listCharges
    tags: [charges, pagination]
    oas:
      operationId: GetCharges
    inputs:
      - name: limit
        type: integer
        default: 10
        constraints:
          min: 1
          max: 100
      - name: startingAfter
        type: string
        optional: true
      - name: paymentIntentId
        type: string
        optional: true
      - name: customerId
        type: string
        optional: true
    outputs:
      - name: charges
        type: charge[]
        elementFields:
          - name: id
            type: string
          - name: status
            type: string
          - name: amount
            type: integer
          - name: refunded
            type: boolean
      - name: count
        type: integer
        display: Charges
      - name: hasMore
        type: boolean
      - name: lastId
        type: string

  updateCharge:
    description: Update a charge's description and metadata note (POST /v1/charges/{charge}, 200).
    adapter: updateCharge
    tags: [charges]
    oas:
      operationId: PostChargesCharge
    inputs:
      - name: chargeId
        type: string
        default:
          from: getPaymentIntent.latestChargeId
      - name: description
        type: string
        optional: true
      - name: note
        type: string
        optional: true
        description: Stored as metadata[note]
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs:
      - name: chargeId
        type: string
        display: Charge
      - name: description
        type: string
      - name: note
        type: string

  # --- Customers, continued --------------------------------------------------------------------

  updateCustomer:
    description: >-
      Update a customer (POST /v1/customers/{customer}, 200): its name, email, description, phone,
      preferred locales, and metadata note. Only the fields given change.
    adapter: updateCustomer
    tags: [customers]
    oas:
      operationId: PostCustomersCustomer
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: name
        type: string
        optional: true
      - name: email
        type: string
        optional: true
      - name: description
        type: string
        optional: true
      - name: phone
        type: string
        optional: true
      - name: preferredLocales
        type: string[]
        optional: true
      - name: note
        type: string
        optional: true
        description: Stored as metadata[note]
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs:
      - name: customerId
        type: string
        display: Customer
      - name: name
        type: string
      - name: email
        type: string
      - name: description
        type: string
      - name: phone
        type: string
      - name: note
        type: string
      - name: balance
        type: integer
        description: The customer's balance in the smallest currency unit; negative is a credit
      - name: preferredLocaleCount
        type: integer

  searchCustomers:
    description: >-
      Search customers with Stripe's search language (GET /v1/customers/search, 200), such as
      email:'ada@example.com'. Search is eventually consistent: a new customer took 16 seconds and 8
      reads to appear, so plans poll it; lists are up to date at once. A field customers can't be
      searched by is 400 with no code. Pages turn with page, the previous response's next_page.
    adapter: searchCustomers
    tags: [customers, search]
    oas:
      operationId: GetCustomersSearch
    inputs:
      - name: query
        type: string
        description: A search query, such as email:'ada@example.com'
      - name: limit
        type: integer
        default: 10
        constraints:
          min: 1
          max: 100
      - name: page
        type: string
        optional: true
        description: The previous response's nextPage
    outputs:
      - name: customers
        type: customer[]
        elementFields:
          - name: id
            type: string
          - name: email
            type: string
      - name: count
        type: integer
        display: Found
      - name: hasMore
        type: boolean
      - name: nextPage
        type: string
        description: The cursor for the next page; "" on the last
      - name: firstId
        type: string
        description: The first customer found; "" when none is

  createCustomerBalanceTransaction:
    description: >-
      Adjust a customer's balance (POST /v1/customers/{customer}/balance_transactions, 200). A
      negative amount is a credit the customer's next invoices use, and a positive one a debit
      added to what they owe; either is recorded as type adjustment, with the balance after it as
      ending_balance. Balance transactions can't be deleted.
    adapter: createCustomerBalanceTransaction
    tags: [customers, balance]
    oas:
      operationId: PostCustomersCustomerBalanceTransactions
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: amount
        type: integer
        description: Negative for a credit, positive for a debit
      - name: currency
        type: string
        default: usd
      - name: description
        type: string
        optional: true
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs: &customerBalanceTransactionOutputs
      - name: customerBalanceTransactionId
        type: string
        display: Balance transaction
      - name: type
        type: string
        description: adjustment for a manual one; others come from invoices, credit notes, and Checkout
      - name: amount
        type: integer
      - name: currency
        type: string
      - name: endingBalance
        type: integer
        display: Balance after
      - name: description
        type: string
      - name: note
        type: string
      - name: source
        type: string

  getCustomerBalanceTransaction:
    description: Read one of a customer's balance transactions (GET /v1/customers/{customer}/balance_transactions/{transaction}, 200).
    adapter: getCustomerBalanceTransaction
    tags: [customers, balance]
    oas:
      operationId: GetCustomersCustomerBalanceTransactionsTransaction
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: customerBalanceTransactionId
        type: string
        default:
          from: createCustomerBalanceTransaction.customerBalanceTransactionId
    outputs: *customerBalanceTransactionOutputs

  updateCustomerBalanceTransaction:
    description: >-
      Update a customer balance transaction's description and metadata note (POST
      /v1/customers/{customer}/balance_transactions/{transaction}, 200); its amount can't change.
    adapter: updateCustomerBalanceTransaction
    tags: [customers, balance]
    oas:
      operationId: PostCustomersCustomerBalanceTransactionsTransaction
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: customerBalanceTransactionId
        type: string
        default:
          from: createCustomerBalanceTransaction.customerBalanceTransactionId
      - name: description
        type: string
        optional: true
      - name: note
        type: string
        optional: true
    outputs: *customerBalanceTransactionOutputs

  listCustomerBalanceTransactions:
    description: Page through a customer's balance transactions (GET /v1/customers/{customer}/balance_transactions, 200), newest first.
    adapter: listCustomerBalanceTransactions
    tags: [customers, balance, pagination]
    oas:
      operationId: GetCustomersCustomerBalanceTransactions
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: limit
        type: integer
        default: 10
        constraints:
          min: 1
          max: 100
      - name: startingAfter
        type: string
        optional: true
    outputs:
      - name: transactions
        type: customerBalanceTransaction[]
        elementFields:
          - name: id
            type: string
          - name: type
            type: string
          - name: amount
            type: integer
          - name: endingBalance
            type: integer
      - name: count
        type: integer
        display: Balance transactions
      - name: hasMore
        type: boolean
      - name: lastId
        type: string
      - name: latestEndingBalance
        type: integer
        description: The newest transaction's ending balance, the customer's balance now; 0 with none

  createTaxId:
    description: >-
      Add a tax ID to a customer (POST /v1/customers/{customer}/tax_ids, 200), such as an eu_vat
      number. Its country comes from the value, and verification starts pending. A value the type
      rejects is 400 tax_id_invalid on param value. Cleanup deletes it.
    adapter: createTaxId
    tags: [customers, tax]
    oas:
      operationId: PostCustomersCustomerTaxIds
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: type
        type: string
        default: eu_vat
        description: One of Stripe's tax ID types, such as eu_vat, us_ein, or gb_vat
      - name: value
        type: string
        default: DE000000000
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs: &taxIdOutputs
      - name: taxId
        type: string
        display: Tax ID
      - name: type
        type: string
      - name: value
        type: string
      - name: country
        type: string
      - name: verificationStatus
        type: string
        description: pending, verified, unverified, or unavailable
      - name: customerId
        type: string
    cleanup: deleteTaxId

  getTaxId:
    description: Read one of a customer's tax IDs (GET /v1/customers/{customer}/tax_ids/{id}, 200).
    adapter: getTaxId
    tags: [customers, tax]
    oas:
      operationId: GetCustomersCustomerTaxIdsId
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: taxId
        type: string
        default:
          from: createTaxId.taxId
    outputs: *taxIdOutputs

  listTaxIds:
    description: Page through a customer's tax IDs (GET /v1/customers/{customer}/tax_ids, 200).
    adapter: listTaxIds
    tags: [customers, tax, pagination]
    oas:
      operationId: GetCustomersCustomerTaxIds
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: limit
        type: integer
        default: 10
        constraints:
          min: 1
          max: 100
      - name: startingAfter
        type: string
        optional: true
    outputs:
      - name: taxIds
        type: taxId[]
        elementFields:
          - name: id
            type: string
          - name: type
            type: string
          - name: value
            type: string
      - name: count
        type: integer
        display: Tax IDs
      - name: hasMore
        type: boolean
      - name: lastId
        type: string

  deleteTaxId:
    description: >-
      Delete a customer's tax ID (DELETE /v1/customers/{customer}/tax_ids/{id}, 200, deleted: true).
      Deleting it again is 404 resource_missing on param id. The cleanup for createTaxId.
    adapter: deleteTaxId
    tags: [customers, tax, cleanup]
    oas:
      operationId: DeleteCustomersCustomerTaxIdsId
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: taxId
        type: string
        default:
          from: createTaxId.taxId
    outputs:
      - name: taxId
        type: string
        display: Deleted
      - name: deleted
        type: boolean

  # --- PaymentMethods --------------------------------------------------------------------------

  createPaymentMethod:
    description: >-
      Create a PaymentMethod (POST /v1/payment_methods, 200): a card from a test token such as
      tok_visa. Sending a raw card number instead is refused (402 invalid_request_error, "generally
      unsafe"). A new PaymentMethod belongs to no customer, and a PaymentMethod can't be deleted.
    adapter: createPaymentMethod
    tags: [payment-methods]
    oas:
      operationId: PostPaymentMethods
    inputs:
      - name: type
        type: string
        default: card
      - name: cardToken
        type: string
        optional: true
        default: tok_visa
        description: A test card token, such as tok_visa or tok_mastercard
      - name: billingName
        type: string
        optional: true
      - name: billingEmail
        type: string
        optional: true
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs: &paymentMethodOutputs
      - name: paymentMethodId
        type: string
        display: PaymentMethod
      - name: type
        type: string
      - name: livemode
        type: boolean
      - name: customerId
        type: string
        description: The customer it is attached to; "" for none
      - name: cardBrand
        type: string
      - name: cardLast4
        type: string
      - name: cardCountry
        type: string
      - name: cardFunding
        type: string
      - name: billingName
        type: string
      - name: allowRedisplay
        type: string
        description: always, limited, or unspecified
      - name: note
        type: string
      - name: source
        type: string
    errorDetection:
      - path: livemode
        rule: equals
        value: true

  getPaymentMethod:
    description: Read a PaymentMethod by its pm_ ID (GET /v1/payment_methods/{payment_method}, 200).
    adapter: getPaymentMethod
    tags: [payment-methods]
    oas:
      operationId: GetPaymentMethodsPaymentMethod
    inputs:
      - name: paymentMethodId
        type: string
        default:
          from: createPaymentMethod.paymentMethodId
    outputs: *paymentMethodOutputs

  updatePaymentMethod:
    description: >-
      Update a PaymentMethod (POST /v1/payment_methods/{payment_method}, 200): its billing name,
      whether it may be shown again to its customer, and its metadata note.
    adapter: updatePaymentMethod
    tags: [payment-methods]
    oas:
      operationId: PostPaymentMethodsPaymentMethod
    inputs:
      - name: paymentMethodId
        type: string
        default:
          from: createPaymentMethod.paymentMethodId
      - name: billingName
        type: string
        optional: true
      - name: allowRedisplay
        type: string
        optional: true
      - name: note
        type: string
        optional: true
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs: *paymentMethodOutputs

  attachPaymentMethod:
    description: >-
      Attach a PaymentMethod to a customer (POST /v1/payment_methods/{payment_method}/attach, 200).
      Attaching a test PaymentMethod such as pm_card_mastercard makes a new one with an ID of its
      own. A PaymentMethod that was detached, or used without a customer, can't be attached again
      (400, with no code).
    adapter: attachPaymentMethod
    tags: [payment-methods]
    oas:
      operationId: PostPaymentMethodsPaymentMethodAttach
    inputs:
      - name: paymentMethodId
        type: string
        default:
          from: createPaymentMethod.paymentMethodId
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs: *paymentMethodOutputs

  detachPaymentMethod:
    description: >-
      Detach a PaymentMethod from its customer (POST /v1/payment_methods/{payment_method}/detach,
      200), for good: it can't be attached again. Detaching one that isn't attached is 400 with no
      code.
    adapter: detachPaymentMethod
    tags: [payment-methods]
    oas:
      operationId: PostPaymentMethodsPaymentMethodDetach
    inputs:
      - name: paymentMethodId
        type: string
        default:
          from: createPaymentMethod.paymentMethodId
    outputs: *paymentMethodOutputs

  listPaymentMethods:
    description: >-
      Page through a customer's PaymentMethods of one type (GET /v1/payment_methods, 200), newest
      first. Without a customer, the list is empty.
    adapter: listPaymentMethods
    tags: [payment-methods, pagination]
    oas:
      operationId: GetPaymentMethods
    inputs: &paymentMethodListInputs
      - name: limit
        type: integer
        default: 10
        constraints:
          min: 1
          max: 100
      - name: customerId
        type: string
        optional: true
      - name: type
        type: string
        optional: true
        default: card
      - name: startingAfter
        type: string
        optional: true
    outputs: &paymentMethodListOutputs
      - name: paymentMethods
        type: paymentMethod[]
        elementFields:
          - name: id
            type: string
          - name: type
            type: string
          - name: cardBrand
            type: string
      - name: count
        type: integer
        display: PaymentMethods
      - name: hasMore
        type: boolean
      - name: lastId
        type: string

  listCustomerPaymentMethods:
    description: Page through a customer's PaymentMethods (GET /v1/customers/{customer}/payment_methods, 200), newest first.
    adapter: listCustomerPaymentMethods
    tags: [payment-methods, customers, pagination]
    oas:
      operationId: GetCustomersCustomerPaymentMethods
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: limit
        type: integer
        default: 10
        constraints:
          min: 1
          max: 100
      - name: type
        type: string
        optional: true
        default: card
      - name: startingAfter
        type: string
        optional: true
    outputs: *paymentMethodListOutputs

  getCustomerPaymentMethod:
    description: >-
      Read one of a customer's PaymentMethods (GET
      /v1/customers/{customer}/payment_methods/{payment_method}, 200). One detached from the customer
      is 404 on param customer.
    adapter: getCustomerPaymentMethod
    tags: [payment-methods, customers]
    oas:
      operationId: GetCustomersCustomerPaymentMethodsPaymentMethod
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: paymentMethodId
        type: string
        default:
          from: createPaymentMethod.paymentMethodId
    outputs: *paymentMethodOutputs

  # --- SetupIntents ----------------------------------------------------------------------------

  createSetupIntent:
    description: >-
      Create a SetupIntent (POST /v1/setup_intents, 200), which saves a payment method for later
      without charging it. Confirmed with a card for off_session usage it succeeds, and the customer
      gets a new PaymentMethod, its own copy of a test card, that then pays off session. A card that
      needs authentication on setup stops it at requires_action with a redirect_to_url next action. A
      declined card is 402 card_error and still leaves the SetupIntent open in
      requires_payment_method. Cleanup reads it and cancels it while it is open.
    adapter: createSetupIntent
    tags: [setup-intents]
    oas:
      operationId: PostSetupIntents
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: paymentMethod
        type: string
        optional: true
        default: pm_card_visa
        description: A payment method ID, or a test one such as pm_card_visa; {} for none yet
      - name: paymentMethodTypes
        type: string[]
        default:
          value: [card]
      - name: confirm
        type: boolean
        optional: true
      - name: usage
        type: string
        optional: true
        description: on_session or off_session (the default)
      - name: returnUrl
        type: string
        optional: true
      - name: description
        type: string
        optional: true
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs: &setupIntentOutputs
      - name: setupIntentId
        type: string
        display: SetupIntent
      - name: status
        type: string
        display: Status
      - name: usage
        type: string
      - name: livemode
        type: boolean
      - name: customerId
        type: string
      - name: paymentMethodId
        type: string
        description: The saved PaymentMethod; "" before one is set
      - name: latestAttemptId
        type: string
        description: The setatt_ ID of the latest attempt; "" before one
      - name: nextActionType
        type: string
      - name: lastSetupErrorCode
        type: string
      - name: lastSetupErrorDeclineCode
        type: string
      - name: cancellationReason
        type: string
      - name: description
        type: string
      - name: note
        type: string
      - name: source
        type: string
    errorDetection:
      - path: livemode
        rule: equals
        value: true
    cleanup:
      node: getSetupIntentForCleanup
      releasedBy: [cancelSetupIntent]

  getSetupIntent:
    description: Read a SetupIntent by its seti_ ID (GET /v1/setup_intents/{intent}, 200).
    adapter: getSetupIntent
    tags: [setup-intents]
    oas:
      operationId: GetSetupIntentsIntent
    inputs:
      - name: setupIntentId
        type: string
        default:
          from: createSetupIntent.setupIntentId
    outputs: *setupIntentOutputs

  getSetupIntentForCleanup:
    description: >-
      Read a SetupIntent's status for cleanup (GET /v1/setup_intents/{intent}, 200), so the cancel
      that follows runs only while it can: in requires_payment_method, requires_confirmation, or
      requires_action. A succeeded or canceled SetupIntent is 400 setup_intent_unexpected_state to a
      cancel.
    adapter: getSetupIntentForCleanup
    tags: [setup-intents, cleanup]
    oas:
      operationId: GetSetupIntentsIntent
    inputs:
      - name: setupIntentId
        type: string
        default:
          from: createSetupIntent.setupIntentId
    outputs:
      - name: setupIntentId
        type: string
      - name: status
        type: string
        display: Status
    cleanup:
      node: cancelSetupIntent
      when: 'status in ["requires_payment_method", "requires_confirmation", "requires_action"]'

  updateSetupIntent:
    description: Update a SetupIntent's description and metadata note (POST /v1/setup_intents/{intent}, 200).
    adapter: updateSetupIntent
    tags: [setup-intents]
    oas:
      operationId: PostSetupIntentsIntent
    inputs:
      - name: setupIntentId
        type: string
        default:
          from: createSetupIntent.setupIntentId
      - name: description
        type: string
        optional: true
      - name: note
        type: string
        optional: true
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs: *setupIntentOutputs

  confirmSetupIntent:
    description: >-
      Confirm a SetupIntent with a payment method (POST /v1/setup_intents/{intent}/confirm, 200). A
      card succeeds, and the customer gets a new PaymentMethod for it.
    adapter: confirmSetupIntent
    tags: [setup-intents]
    oas:
      operationId: PostSetupIntentsIntentConfirm
    inputs:
      - name: setupIntentId
        type: string
        default:
          from: createSetupIntent.setupIntentId
      - name: paymentMethod
        type: string
        optional: true
      - name: returnUrl
        type: string
        optional: true
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs: *setupIntentOutputs

  cancelSetupIntent:
    description: >-
      Cancel a SetupIntent (POST /v1/setup_intents/{intent}/cancel, 200) while it is
      requires_payment_method, requires_confirmation, or requires_action. A succeeded or canceled one
      is 400 setup_intent_unexpected_state. The cleanup for an open SetupIntent.
    adapter: cancelSetupIntent
    tags: [setup-intents, cleanup]
    oas:
      operationId: PostSetupIntentsIntentCancel
    inputs:
      - name: setupIntentId
        type: string
        default:
          from: createSetupIntent.setupIntentId
      - name: cancellationReason
        type: string
        optional: true
        description: abandoned, duplicate, or requested_by_customer
    outputs: *setupIntentOutputs

  listSetupIntents:
    description: >-
      Page through SetupIntents (GET /v1/setup_intents, 200), newest first, narrowed to one customer
      or to those created at or after a Unix time. Each page counts the SetupIntents this package
      created and those of them still open, and lists the open ones.
    adapter: listSetupIntents
    tags: [setup-intents, pagination]
    oas:
      operationId: GetSetupIntents
    inputs:
      - name: limit
        type: integer
        default: 10
        constraints:
          min: 1
          max: 100
      - name: customerId
        type: string
        optional: true
      - name: createdGte
        type: integer
        optional: true
      - name: startingAfter
        type: string
        optional: true
    outputs:
      - name: setupIntents
        type: setupIntent[]
        elementFields:
          - name: id
            type: string
          - name: status
            type: string
      - name: count
        type: integer
        display: SetupIntents
      - name: hasMore
        type: boolean
      - name: lastId
        type: string
      - name: ourCount
        type: integer
        display: Ours
      - name: ourOpenCount
        type: integer
        display: Ours still open
      - name: ourOpen
        type: openSetupIntent[]
        optional: true
        elementFields:
          - name: id
            type: string
          - name: status
            type: string
          - name: created
            type: integer
      - name: liveCount
        type: integer

  listSetupAttempts:
    description: >-
      Page through a SetupIntent's attempts (GET /v1/setup_attempts, 200), newest first; setup_intent
      is required. A SetupIntent confirmed once has one attempt, with its status and usage.
    adapter: listSetupAttempts
    tags: [setup-intents, pagination]
    oas:
      operationId: GetSetupAttempts
    inputs:
      - name: setupIntentId
        type: string
        default:
          from: createSetupIntent.setupIntentId
      - name: limit
        type: integer
        default: 10
        constraints:
          min: 1
          max: 100
      - name: startingAfter
        type: string
        optional: true
    outputs:
      - name: attempts
        type: setupAttempt[]
        elementFields:
          - name: id
            type: string
          - name: status
            type: string
          - name: usage
            type: string
      - name: count
        type: integer
        display: Attempts
      - name: hasMore
        type: boolean
      - name: lastId
        type: string
      - name: latestStatus
        type: string
        description: The newest attempt's status; "" with none

  # --- ACH debits ------------------------------------------------------------------------------

  createAchPaymentMethod:
    description: >-
      Create a us_bank_account PaymentMethod from a routing and account number (POST
      /v1/payment_methods, 200). Stripe's test routing number is 110000000, and the account number
      chooses what the debit does later: 000123456789 succeeds, 000222222227 fails for insufficient
      funds, and 000111111113 for a closed account. The bank is "STRIPE TEST BANK", and the account
      is a checking account on the ach network.
    adapter: createAchPaymentMethod
    tags: [payment-methods, ach]
    oas:
      operationId: PostPaymentMethods
    inputs:
      - name: routingNumber
        type: string
        default: "110000000"
      - name: accountNumber
        type: string
        default: "000123456789"
      - name: accountHolderType
        type: string
        default: individual
      - name: billingName
        type: string
        default: AAT Stripe
      - name: billingEmail
        type: string
        optional: true
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs:
      - name: paymentMethodId
        type: string
        display: PaymentMethod
      - name: type
        type: string
      - name: livemode
        type: boolean
      - name: customerId
        type: string
      - name: bankName
        type: string
      - name: last4
        type: string
      - name: accountHolderType
        type: string
      - name: accountType
        type: string
      - name: preferredNetwork
        type: string
      - name: billingName
        type: string
      - name: source
        type: string
    errorDetection:
      - path: livemode
        rule: equals
        value: true

  createAchPaymentIntent:
    description: >-
      Charge a US bank account (POST /v1/payment_intents, 200) with payment_method_types
      us_bank_account. It needs mandate acceptance: without mandate_data the create is 400 and still
      leaves a PaymentIntent in requires_confirmation. A bank account given by its numbers has to be
      verified first, so the PaymentIntent waits in requires_action with a verify_with_microdeposits
      next action, whose microdeposit_type on this account is descriptor_code. Verified, it goes to
      processing and reaches succeeded in about 20 seconds; a failing test account ends
      requires_payment_method with the reason as last_payment_error.
    adapter: createAchPaymentIntent
    tags: [payments, ach]
    oas:
      operationId: PostPaymentIntents
    inputs: &achIntentInputs
      - name: amount
        type: integer
        default: 1500
      - name: currency
        type: string
        default: usd
      - name: customerId
        type: string
        optional: true
        default:
          from: createCustomer.customerId
      - name: paymentMethod
        type: string
        optional: true
        default:
          from: createAchPaymentMethod.paymentMethodId
      - name: confirm
        type: boolean
        optional: true
        default: true
      - name: offSession
        type: boolean
        optional: true
      - name: verificationMethod
        type: string
        optional: true
        description: automatic (the default) or microdeposits
      - name: acceptanceType
        type: string
        optional: true
        default: online
        description: How the customer accepted the mandate; {} sends none, which Stripe refuses
      - name: acceptanceIp
        type: string
        optional: true
        default: 203.0.113.10
      - name: acceptanceUserAgent
        type: string
        optional: true
        default: aat-stripe
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs: &achIntentOutputs
      - name: paymentIntentId
        type: string
        display: PaymentIntent
      - name: status
        type: string
        display: Status
      - name: amount
        type: integer
      - name: currency
        type: string
      - name: amountReceived
        type: integer
      - name: livemode
        type: boolean
      - name: customerId
        type: string
      - name: paymentMethodId
        type: string
      - name: latestChargeId
        type: string
      - name: chargeStatus
        type: string
      - name: mandateId
        type: string
        description: The mandate the debit used; "" before the charge exists
      - name: nextActionType
        type: string
      - name: microdepositType
        type: string
        description: descriptor_code or amounts, the way the deposits are verified
      - name: lastErrorType
        type: string
      - name: lastErrorCode
        type: string
      - name: lastDeclineCode
        type: string
      - name: chargeFailureCode
        type: string
      - name: source
        type: string
    errorDetection:
      - path: livemode
        rule: equals
        value: true
    cleanup:
      node: getPaymentIntentForCleanup
      releasedBy: [cancelPaymentIntent]

  verifyPaymentIntentMicrodeposits:
    description: >-
      Verify the microdeposits of an ACH PaymentIntent (POST
      /v1/payment_intents/{intent}/verify_microdeposits, 200), which moves it from requires_action to
      processing. In test mode the descriptor code is SM11AA and the amounts are 32 and 45. A wrong
      code is 400 payment_method_microdeposit_verification_descriptor_code_mismatch, one amount is
      400 payment_method_microdeposit_verification_amounts_invalid on param amounts, and verifying a
      PaymentIntent that isn't waiting is 400 payment_intent_unexpected_state.
    adapter: verifyPaymentIntentMicrodeposits
    tags: [payments, ach]
    oas:
      operationId: PostPaymentIntentsIntentVerifyMicrodeposits
    inputs:
      - name: paymentIntentId
        type: string
        default:
          from: createAchPaymentIntent.paymentIntentId
      - name: descriptorCode
        type: string
        optional: true
        default: SM11AA
      - name: amounts
        type: integer[]
        optional: true
        description: The two deposit amounts, instead of a descriptor code
    outputs:
      - name: paymentIntentId
        type: string
      - name: status
        type: string
        display: Status
      - name: nextActionType
        type: string
      - name: amountReceived
        type: integer
      - name: lastErrorCode
        type: string

  createAchSetupIntent:
    description: >-
      Save a US bank account for later debits (POST /v1/setup_intents, 200) with
      payment_method_types us_bank_account and mandate acceptance. The mandate is recorded as the
      SetupIntent is created, and it waits in requires_action for microdeposit verification; verified,
      it succeeds with that mandate now multi_use and active, and the PaymentMethod is attached to the
      customer. A later off-session PaymentIntent on that
      PaymentMethod reuses the same mandate.
    adapter: createAchSetupIntent
    tags: [setup-intents, ach]
    oas:
      operationId: PostSetupIntents
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: paymentMethod
        type: string
        optional: true
        default:
          from: createAchPaymentMethod.paymentMethodId
      - name: confirm
        type: boolean
        optional: true
        default: true
      - name: usage
        type: string
        optional: true
      - name: acceptanceType
        type: string
        optional: true
        default: online
      - name: acceptanceIp
        type: string
        optional: true
        default: 203.0.113.10
      - name: acceptanceUserAgent
        type: string
        optional: true
        default: aat-stripe
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs:
      - name: setupIntentId
        type: string
        display: SetupIntent
      - name: status
        type: string
        display: Status
      - name: usage
        type: string
      - name: livemode
        type: boolean
      - name: customerId
        type: string
      - name: paymentMethodId
        type: string
      - name: mandateId
        type: string
      - name: latestAttemptId
        type: string
      - name: nextActionType
        type: string
      - name: microdepositType
        type: string
      - name: lastSetupErrorCode
        type: string
      - name: source
        type: string
    errorDetection:
      - path: livemode
        rule: equals
        value: true
    cleanup:
      node: getSetupIntentForCleanup
      releasedBy: [cancelSetupIntent]

  verifySetupIntentMicrodeposits:
    description: >-
      Verify the microdeposits of an ACH SetupIntent (POST
      /v1/setup_intents/{intent}/verify_microdeposits, 200), which succeeds it and records its
      mandate. Verifying one that already succeeded is 400 intent_invalid_state, where a
      PaymentIntent says payment_intent_unexpected_state.
    adapter: verifySetupIntentMicrodeposits
    tags: [setup-intents, ach]
    oas:
      operationId: PostSetupIntentsIntentVerifyMicrodeposits
    inputs:
      - name: setupIntentId
        type: string
        default:
          from: createAchSetupIntent.setupIntentId
      - name: descriptorCode
        type: string
        optional: true
        default: SM11AA
      - name: amounts
        type: integer[]
        optional: true
    outputs:
      - name: setupIntentId
        type: string
      - name: status
        type: string
        display: Status
      - name: mandateId
        type: string
        display: Mandate
      - name: paymentMethodId
        type: string
      - name: nextActionType
        type: string
      - name: lastSetupErrorCode
        type: string

  getMandate:
    description: >-
      Read a mandate (GET /v1/mandates/{mandate}, 200), the customer's authorization for a debit. A
      SetupIntent's is multi_use and active; a single payment's is single_use and inactive once it is
      used. It records how the customer accepted it, with the IP address and user agent sent as
      mandate_data. An unknown mandate is 404 resource_missing on param mandate.
    adapter: getMandate
    tags: [ach, sepa]
    oas:
      operationId: GetMandatesMandate
    inputs:
      - name: mandateId
        type: string
        default:
          from: verifySetupIntentMicrodeposits.mandateId
    outputs:
      - name: mandateId
        type: string
        display: Mandate
      - name: type
        type: string
        description: multi_use or single_use
      - name: status
        type: string
        description: active, inactive, or pending
      - name: livemode
        type: boolean
      - name: paymentMethodId
        type: string
      - name: paymentMethodType
        type: string
      - name: acceptanceType
        type: string
      - name: acceptanceIp
        type: string
      - name: acceptanceUserAgent
        type: string
      - name: sepaReferenceSet
        type: string
        description: A SEPA mandate's reference; "" for other types

  # --- SEPA Direct Debit -----------------------------------------------------------------------

  createSepaPaymentMethod:
    description: >-
      Create a sepa_debit PaymentMethod from an IBAN (POST /v1/payment_methods, 200). Stripe's test
      IBAN DE89370400440532013000 succeeds, and DE62370400440532013001 fails after the charge is
      made. The country and bank code come from the IBAN. A PaymentMethod used once without a
      customer can't be attached later.
    adapter: createSepaPaymentMethod
    tags: [payment-methods, sepa]
    oas:
      operationId: PostPaymentMethods
    inputs:
      - name: iban
        type: string
        default: DE89370400440532013000
      - name: billingName
        type: string
        default: AAT Stripe
      - name: billingEmail
        type: string
        default: aat-stripe@example.com
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs:
      - name: paymentMethodId
        type: string
        display: PaymentMethod
      - name: type
        type: string
      - name: livemode
        type: boolean
      - name: customerId
        type: string
      - name: country
        type: string
      - name: last4
        type: string
      - name: bankCode
        type: string
      - name: billingName
        type: string
      - name: source
        type: string
    errorDetection:
      - path: livemode
        rule: equals
        value: true

  createSepaPaymentIntent:
    description: >-
      Charge a SEPA bank account in euros (POST /v1/payment_intents, 200), with the IBAN sent as
      payment_method_data and mandate acceptance. Confirmed, it goes to processing at once and
      reaches succeeded in about 15 seconds; the failing test IBAN ends requires_payment_method with
      last_payment_error payment_intent_payment_attempt_failed, whose charge failed with
      incorrect_account_holder_name.
    adapter: createSepaPaymentIntent
    tags: [payments, sepa]
    oas:
      operationId: PostPaymentIntents
    inputs:
      - name: amount
        type: integer
        default: 1000
      - name: currency
        type: string
        default: eur
      - name: customerId
        type: string
        optional: true
        default:
          from: createCustomer.customerId
      - name: iban
        type: string
        default: DE89370400440532013000
      - name: billingName
        type: string
        default: AAT Stripe
      - name: billingEmail
        type: string
        default: aat-stripe@example.com
      - name: confirm
        type: boolean
        optional: true
        default: true
      - name: acceptanceType
        type: string
        optional: true
        default: online
      - name: acceptanceIp
        type: string
        optional: true
        default: 203.0.113.10
      - name: acceptanceUserAgent
        type: string
        optional: true
        default: aat-stripe
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs:
      - name: paymentIntentId
        type: string
        display: PaymentIntent
      - name: status
        type: string
        display: Status
      - name: amount
        type: integer
      - name: currency
        type: string
      - name: amountReceived
        type: integer
      - name: livemode
        type: boolean
      - name: customerId
        type: string
      - name: paymentMethodId
        type: string
      - name: latestChargeId
        type: string
      - name: chargeStatus
        type: string
      - name: mandateId
        type: string
      - name: lastErrorType
        type: string
      - name: lastErrorCode
        type: string
      - name: lastDeclineCode
        type: string
      - name: chargeFailureCode
        type: string
      - name: source
        type: string
    errorDetection:
      - path: livemode
        rule: equals
        value: true
    cleanup:
      node: getPaymentIntentForCleanup
      releasedBy: [cancelPaymentIntent]

  # --- Cash balance and bank transfers ----------------------------------------------------------

  getCashBalance:
    description: >-
      Read a customer's cash balance (GET /v1/customers/{customer}/cash_balance, 200): what they have
      paid in by bank transfer, per currency, and how it is applied. reconciliation_mode is automatic
      by default, when a payment takes what it needs as soon as the money arrives, or manual, when
      apply_customer_balance does it. A customer with a positive cash balance can't be deleted.
    adapter: getCashBalance
    tags: [customers, cash-balance]
    oas:
      operationId: GetCustomersCustomerCashBalance
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
    outputs: &cashBalanceOutputs
      - name: customerId
        type: string
      - name: livemode
        type: boolean
      - name: reconciliationMode
        type: string
        display: Reconciliation
      - name: usingMerchantDefault
        type: boolean
      - name: availableUsd
        type: integer
        display: USD available
      - name: availableEur
        type: integer
      - name: currencyCount
        type: integer

  updateCashBalance:
    description: >-
      Set how a customer's cash balance is applied (POST /v1/customers/{customer}/cash_balance, 200):
      reconciliation_mode automatic, manual, or merchant_default. Another value is 400 on param
      settings[reconciliation_mode], with no code.
    adapter: updateCashBalance
    tags: [customers, cash-balance]
    oas:
      operationId: PostCustomersCustomerCashBalance
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: reconciliationMode
        type: string
        default: manual
    outputs:
      - name: customerId
        type: string
      - name: reconciliationMode
        type: string
        display: Reconciliation
      - name: usingMerchantDefault
        type: boolean
      - name: availableUsd
        type: integer

  createFundingInstructions:
    description: >-
      Ask for the bank details a customer pays into (POST
      /v1/customers/{customer}/funding_instructions, 200). A us_bank_transfer gives two financial
      addresses, aba and swift, and the same customer gets the same details again. A eu_bank_transfer
      needs its country, and euros.
    adapter: createFundingInstructions
    tags: [customers, cash-balance]
    oas:
      operationId: PostCustomersCustomerFundingInstructions
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: fundingType
        type: string
        default: bank_transfer
      - name: currency
        type: string
        default: usd
      - name: bankTransferType
        type: string
        default: us_bank_transfer
        description: us_bank_transfer, eu_bank_transfer, gb_bank_transfer, jp_bank_transfer, or mx_bank_transfer
      - name: euCountry
        type: string
        optional: true
        description: The country of a eu_bank_transfer, such as DE
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs:
      - name: currency
        type: string
      - name: fundingType
        type: string
      - name: livemode
        type: boolean
      - name: bankTransferType
        type: string
      - name: addressCount
        type: integer
        display: Bank addresses
      - name: addressTypes
        type: string[]
      - name: firstAddressType
        type: string

  fundCashBalance:
    description: >-
      Pretend money arrived by bank transfer (POST
      /v1/test_helpers/customers/{customer}/fund_cash_balance, 200), a test-mode helper. It records a
      funded cash balance transaction with the balance after it, and the reference the sender gave.
      An amount below 1 is 400 parameter_invalid_integer on param amount.
    adapter: fundCashBalance
    tags: [customers, cash-balance, test-helpers]
    oas:
      operationId: PostTestHelpersCustomersCustomerFundCashBalance
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: amount
        type: integer
        default: 5000
      - name: currency
        type: string
        default: usd
      - name: reference
        type: string
        optional: true
        default: aat-stripe
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs:
      - name: cashBalanceTransactionId
        type: string
        display: Cash balance transaction
      - name: type
        type: string
        description: funded, applied_to_payment, refunded_from_payment, and others
      - name: netAmount
        type: integer
      - name: endingBalance
        type: integer
        display: Balance after
      - name: currency
        type: string
      - name: customerId
        type: string
      - name: livemode
        type: boolean
      - name: bankTransferType
        type: string
      - name: reference
        type: string

  listCashBalanceTransactions:
    description: >-
      Page through a customer's cash balance transactions (GET
      /v1/customers/{customer}/cash_balance_transactions, 200), newest first: what arrived, and what
      each payment took.
    adapter: listCashBalanceTransactions
    tags: [customers, cash-balance, pagination]
    oas:
      operationId: GetCustomersCustomerCashBalanceTransactions
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: limit
        type: integer
        default: 10
        constraints:
          min: 1
          max: 100
      - name: startingAfter
        type: string
        optional: true
    outputs:
      - name: transactions
        type: cashBalanceTransaction[]
        elementFields:
          - name: id
            type: string
          - name: type
            type: string
          - name: netAmount
            type: integer
          - name: endingBalance
            type: integer
          - name: currency
            type: string
      - name: count
        type: integer
        display: Transactions
      - name: hasMore
        type: boolean
      - name: lastId
        type: string
      - name: latestType
        type: string
      - name: latestEndingBalance
        type: integer

  getCashBalanceTransaction:
    description: Read one of a customer's cash balance transactions (GET /v1/customers/{customer}/cash_balance_transactions/{transaction}, 200).
    adapter: getCashBalanceTransaction
    tags: [customers, cash-balance]
    oas:
      operationId: GetCustomersCustomerCashBalanceTransactionsTransaction
    inputs:
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: cashBalanceTransactionId
        type: string
        default:
          from: fundCashBalance.cashBalanceTransactionId
    outputs:
      - name: cashBalanceTransactionId
        type: string
      - name: type
        type: string
      - name: netAmount
        type: integer
      - name: endingBalance
        type: integer
      - name: currency
        type: string
      - name: customerId
        type: string
      - name: reference
        type: string
      - name: appliedPaymentIntentId
        type: string

  createBankTransferPaymentIntent:
    description: >-
      Take a payment from a customer's cash balance (POST /v1/payment_intents, 200) with
      payment_method_types customer_balance. With automatic reconciliation and enough money it
      succeeds at once; with less it takes what there is and waits in requires_action with the
      amount_remaining, then succeeds when the rest arrives. With manual reconciliation it waits for
      apply_customer_balance instead.
    adapter: createBankTransferPaymentIntent
    tags: [payments, cash-balance]
    oas:
      operationId: PostPaymentIntents
    inputs:
      - name: amount
        type: integer
        default: 2000
      - name: currency
        type: string
        default: usd
      - name: customerId
        type: string
        default:
          from: createCustomer.customerId
      - name: bankTransferType
        type: string
        default: us_bank_transfer
      - name: euCountry
        type: string
        optional: true
      - name: confirm
        type: boolean
        optional: true
        default: true
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs:
      - name: paymentIntentId
        type: string
        display: PaymentIntent
      - name: status
        type: string
        display: Status
      - name: amount
        type: integer
      - name: currency
        type: string
      - name: amountReceived
        type: integer
      - name: livemode
        type: boolean
      - name: customerId
        type: string
      - name: latestChargeId
        type: string
      - name: nextActionType
        type: string
      - name: amountRemaining
        type: integer
        display: Still to pay
      - name: source
        type: string
    errorDetection:
      - path: livemode
        rule: equals
        value: true
    cleanup:
      node: getPaymentIntentForCleanup
      releasedBy: [cancelPaymentIntent]

  applyCustomerBalance:
    description: >-
      Put a customer's cash balance toward a payment waiting for it (POST
      /v1/payment_intents/{intent}/apply_customer_balance, 200), which manual reconciliation needs.
      Part of the amount leaves the rest as amount_remaining; the rest succeeds it. More than remains
      is 400 with no code, as is a currency that isn't the payment's, and applying to a succeeded
      payment is 400 payment_intent_unexpected_state.
    adapter: applyCustomerBalance
    tags: [payments, cash-balance]
    oas:
      operationId: PostPaymentIntentsIntentApplyCustomerBalance
    inputs:
      - name: paymentIntentId
        type: string
        default:
          from: createBankTransferPaymentIntent.paymentIntentId
      - name: amount
        type: integer
        optional: true
        description: How much to apply; all that is needed when left out
      - name: currency
        type: string
        optional: true
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs:
      - name: paymentIntentId
        type: string
      - name: status
        type: string
        display: Status
      - name: amount
        type: integer
      - name: amountReceived
        type: integer
      - name: nextActionType
        type: string
      - name: amountRemaining
        type: integer
        display: Still to pay

  # --- Tokens and confirmation tokens -----------------------------------------------------------

  createToken:
    description: >-
      Create a single-use token (POST /v1/tokens, 200): a bank account (btok_), a PII number (pii_),
      or a CVC collected again (cvctok_). Exactly one kind per request: none is 400
      parameter_missing, and two at once is 400 with no code. A raw card number is refused as it is
      on PaymentMethods (402, "generally unsafe"). A token is used once, and reusing it is 400
      token_already_used.
    adapter: createToken
    tags: [tokens]
    oas:
      operationId: PostTokens
    inputs:
      - name: bankCountry
        type: string
        optional: true
      - name: bankCurrency
        type: string
        optional: true
      - name: routingNumber
        type: string
        optional: true
      - name: accountNumber
        type: string
        optional: true
      - name: accountHolderName
        type: string
        optional: true
      - name: accountHolderType
        type: string
        optional: true
      - name: idNumber
        type: string
        optional: true
        description: A PII number, such as a test SSN
      - name: cvc
        type: string
        optional: true
        description: A card's CVC, for a cvc_update token
      - name: cardNumber
        type: string
        optional: true
        description: A raw card number, which Stripe refuses
      - name: cardExpMonth
        type: string
        optional: true
      - name: cardExpYear
        type: string
        optional: true
      - name: cardCvc
        type: string
        optional: true
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs: &tokenOutputs
      - name: tokenId
        type: string
        display: Token
      - name: type
        type: string
        description: bank_account, pii, cvc_update, card, account, or person
      - name: used
        type: boolean
      - name: livemode
        type: boolean
      - name: clientIpSet
        type: string
      - name: bankLast4
        type: string
      - name: bankStatus
        type: string
      - name: bankName
        type: string
      - name: bankCountry
        type: string
      - name: cardBrand
        type: string
    errorDetection:
      - path: livemode
        rule: equals
        value: true

  getToken:
    description: >-
      Read a token by its ID (GET /v1/tokens/{token}, 200), which says whether it has been used. An
      unknown token is 400 resource_missing on param token, not 404. Stripe's test card tokens, such
      as tok_visa, read back as cards.
    adapter: getToken
    tags: [tokens]
    oas:
      operationId: GetTokensToken
    inputs:
      - name: tokenId
        type: string
        default:
          from: createToken.tokenId
    outputs:
      - name: tokenId
        type: string
      - name: type
        type: string
      - name: used
        type: boolean
        display: Used
      - name: livemode
        type: boolean
      - name: bankLast4
        type: string
      - name: cardBrand
        type: string

  createConfirmationToken:
    description: >-
      Create a ConfirmationToken (POST /v1/test_helpers/confirmation_tokens, 200), the test-mode
      stand-in for what Stripe.js collects: a payment method, what it may be saved for, and a return
      URL, gathered into one ctoken_ that confirms a PaymentIntent. It lasts 12 hours and previews
      the payment method. Confirming with it a second time is 400
      payment_intent_confirmation_token_invalid.
    adapter: createConfirmationToken
    tags: [payments, test-helpers]
    oas:
      operationId: PostTestHelpersConfirmationTokens
    inputs:
      - name: paymentMethod
        type: string
        optional: true
        default: pm_card_visa
      - name: setupFutureUsage
        type: string
        optional: true
        description: on_session or off_session; the PaymentIntent must ask for the same
      - name: returnUrl
        type: string
        optional: true
      - name: idempotencyKey
        type: string
        optional: true
        default: "{{uuid}}"
    outputs: &confirmationTokenOutputs
      - name: confirmationTokenId
        type: string
        display: ConfirmationToken
      - name: livemode
        type: boolean
      - name: created
        type: integer
      - name: expiresAt
        type: integer
      - name: setupFutureUsage
        type: string
      - name: previewType
        type: string
      - name: previewBrand
        type: string
      - name: previewLast4
        type: string
      - name: paymentIntentId
        type: string
        description: The PaymentIntent it confirmed; "" until it is used
      - name: setupIntentId
        type: string
    errorDetection:
      - path: livemode
        rule: equals
        value: true

  getConfirmationToken:
    description: >-
      Read a ConfirmationToken (GET /v1/confirmation_tokens/{confirmation_token}, 200), which names
      the PaymentIntent it confirmed once it is used. An unknown one is 404 resource_missing on param
      confirmation_token.
    adapter: getConfirmationToken
    tags: [payments]
    oas:
      operationId: GetConfirmationTokensConfirmationToken
    inputs:
      - name: confirmationTokenId
        type: string
        default:
          from: createConfirmationToken.confirmationTokenId
    outputs:
      - name: confirmationTokenId
        type: string
      - name: livemode
        type: boolean
      - name: created
        type: integer
      - name: expiresAt
        type: integer
      - name: previewType
        type: string
      - name: previewBrand
        type: string
      - name: setupFutureUsage
        type: string
      - name: paymentIntentId
        type: string
      - name: setupIntentId
        type: string

  # --- Search -----------------------------------------------------------------------------------

  searchPaymentIntents:
    description: >-
      Search PaymentIntents (GET /v1/payment_intents/search, 200) by customer, status, metadata, or
      amount, with comparisons such as amount>1500. Like every Stripe search it lags: new
      PaymentIntents took about 30 seconds to appear, while the list has them at once. A field that
      can't be searched is 400 with no code, and no query at all is 400 parameter_missing on param
      query.
    adapter: searchPaymentIntents
    tags: [payments, search]
    oas:
      operationId: GetPaymentIntentsSearch
    inputs:
      - name: query
        type: string
        optional: true
        description: A search query; {} sends none, which Stripe refuses
      - name: limit
        type: integer
        default: 20
        constraints:
          min: 1
          max: 100
      - name: page
        type: string
        optional: true
    outputs:
      - name: paymentIntents
        type: paymentIntent[]
        elementFields:
          - name: id
            type: string
          - name: status
            type: string
          - name: amount
            type: integer
      - name: count
        type: integer
        display: Found
      - name: hasMore
        type: boolean
      - name: nextPage
        type: string
      - name: firstId
        type: string
      - name: statuses
        type: string[]

  searchCharges:
    description: >-
      Search charges (GET /v1/charges/search, 200) by customer, status, refunded, metadata, or
      amount. Charges were in the index sooner than PaymentIntents, though a search still lags a
      list.
    adapter: searchCharges
    tags: [payments, search]
    oas:
      operationId: GetChargesSearch
    inputs:
      - name: query
        type: string
      - name: limit
        type: integer
        default: 20
        constraints:
          min: 1
          max: 100
      - name: page
        type: string
        optional: true
    outputs:
      - name: charges
        type: charge[]
        elementFields:
          - name: id
            type: string
          - name: status
            type: string
          - name: amount
            type: integer
          - name: refunded
            type: boolean
      - name: count
        type: integer
        display: Found
      - name: hasMore
        type: boolean
      - name: nextPage
        type: string
      - name: firstId
        type: string

  # --- Refunds that wait on the customer --------------------------------------------------------

  cancelRefund:
    description: >-
      Cancel a refund that is waiting on the customer (POST /v1/refunds/{refund}/cancel, 200), which
      only a refund in requires_action allows. A card refund, which succeeds at once, is 400 with no
      code ("Canceling this refund is unsupported"). Refunds of bank transfer payments, the ones that
      can wait, are gated on this account.
    adapter: cancelRefund
    tags: [refunds]
    oas:
      operationId: PostRefundsRefundCancel
    inputs:
      - name: refundId
        type: string
        default:
          from: createRefund.refundId
    outputs:
      - name: refundId
        type: string
      - name: status
        type: string
        display: Status
      - name: failureReason
        type: string

  expireRefund:
    description: >-
      Expire a refund that is waiting on the customer (POST
      /v1/test_helpers/refunds/{refund}/expire, 200), a test-mode helper for a refund in
      requires_action. A card refund is 400 with no code, pointing at the charge refund endpoint.
    adapter: expireRefund
    tags: [refunds, test-helpers]
    oas:
      operationId: PostTestHelpersRefundsRefundExpire
    inputs:
      - name: refundId
        type: string
        default:
          from: createRefund.refundId
    outputs:
      - name: refundId
        type: string
      - name: status
        type: string
        display: Status
      - name: failureReason
        type: string

workflows:
  - name: Card Payment
    description: A new customer pays by card with a PaymentIntent, captured the way the capture slot chooses, and the payment is read back with its charge
    template: workflows/card-payment.yaml
    slots:
      - name: capture
        options: [Automatic Capture, Manual Capture, Partial Capture, Cancel Authorization]
        default: Automatic Capture
    selectionHint: Paying by card, with layers for the card brand, the currency, and the amount

  - name: Automatic Capture
    kind: slot
    description: Create and confirm the PaymentIntent with the card, captured at once
    template: workflows/slots/automatic-capture.yaml

  - name: Manual Capture
    kind: slot
    description: Authorize the card, then capture the whole authorization
    template: workflows/slots/manual-capture.yaml

  - name: Partial Capture
    kind: slot
    description: Authorize the card, then capture all but 500 and release the rest
    template: workflows/slots/partial-capture.yaml

  - name: Cancel Authorization
    kind: slot
    description: Authorize the card, then cancel and release the whole authorization
    template: workflows/slots/cancel-authorization.yaml

  - name: Declined Card
    description: A PaymentIntent created without a card is declined with the card the decline slot chooses, stays open for another card, and is paid with a working one
    template: workflows/declined-card.yaml
    slots:
      - name: decline
        options: [Generic Decline, Insufficient Funds, Lost Card, Stolen Card, Expired Card, Incorrect CVC, Processing Error, Fraudulent]
        default: Generic Decline
    selectionHint: A card the issuer declines, with the exact error Stripe returns, then a card that works

  - name: Generic Decline
    kind: slot
    description: Confirm with a card declined without a reason
    template: workflows/slots/decline-generic.yaml

  - name: Insufficient Funds
    kind: slot
    description: Confirm with a card declined for insufficient funds
    template: workflows/slots/decline-insufficient-funds.yaml

  - name: Lost Card
    kind: slot
    description: Confirm with a card declined as lost
    template: workflows/slots/decline-lost-card.yaml

  - name: Stolen Card
    kind: slot
    description: Confirm with a card declined as stolen
    template: workflows/slots/decline-stolen-card.yaml

  - name: Expired Card
    kind: slot
    description: Confirm with an expired card
    template: workflows/slots/decline-expired-card.yaml

  - name: Incorrect CVC
    kind: slot
    description: Confirm with a card whose CVC is wrong
    template: workflows/slots/decline-incorrect-cvc.yaml

  - name: Processing Error
    kind: slot
    description: Confirm with a card whose charge meets a processing error
    template: workflows/slots/decline-processing-error.yaml

  - name: Fraudulent
    kind: slot
    description: Confirm with a card declined as suspected fraud
    template: workflows/slots/decline-fraudulent.yaml

  - name: Saved Card
    description: A customer saves a card with a SetupIntent for off-session use, and a PaymentIntent later charges the saved card with no customer present
    template: workflows/saved-card.yaml
    selectionHint: Saving a card for later and charging it off session, with layers for the currency and the amount

  - name: ACH Debit
    description: A US bank account is verified with microdeposits and debited, and the outcome slot chooses the test account that decides what the bank does
    template: workflows/ach-debit.yaml
    slots:
      - name: outcome
        options: [Bank Account Pays, Bank Account Without Funds, Closed Bank Account]
        default: Bank Account Pays
    selectionHint: Paying by US bank account (ACH), which settles about 20 seconds after it is verified

  - name: Bank Account Pays
    kind: slot
    description: A bank account whose debit goes through, settling about 20 seconds after verification
    template: workflows/slots/ach-succeeds.yaml

  - name: Bank Account Without Funds
    kind: slot
    description: A bank account that fails the debit for insufficient funds
    template: workflows/slots/ach-insufficient-funds.yaml

  - name: Closed Bank Account
    kind: slot
    description: A bank account that is closed, which fails the debit
    template: workflows/slots/ach-account-closed.yaml

  - name: Bank Transfer
    description: A customer pays out of the cash balance they funded by bank transfer, reconciled the way the reconciliation slot chooses
    template: workflows/bank-transfer.yaml
    slots:
      - name: reconciliation
        options: [Automatic Reconciliation, Manual Reconciliation]
        default: Automatic Reconciliation
    selectionHint: Paying by bank transfer into a customer's cash balance

  - name: Automatic Reconciliation
    kind: slot
    description: The payment takes what it needs from the cash balance as the transfer arrives
    template: workflows/slots/automatic-reconciliation.yaml

  - name: Manual Reconciliation
    kind: slot
    description: The payment waits until apply_customer_balance puts the balance toward it, here in two parts
    template: workflows/slots/manual-reconciliation.yaml
